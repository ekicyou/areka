  <line x1="470" y1="476" x2="470" y2="490" stroke="#888780" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="300" y="492" width="340" height="38" rx="9" fill="#CECBF6" stroke="#534AB7" stroke-width="2"/>
  <text x="470" y="509" text-anchor="middle" font-size="9.5" font-weight="700" fill="#26215C">M-e2e 🎯 areka-P0-emo2-conformance-e2e</text>
  <text x="470" y="523" text-anchor="middle" font-size="7.5" fill="#26215C">全7トラック統合・一周適合</text>

  <text x="470" y="548" text-anchor="middle" font-size="8.3" fill="#5F5E5A">低レベルマウス＝独立仕様なし（completed の hit-test/alpha/drag を render が所有）　｜　owner-draw 右クリックメニュー → M2（M1 メニュー＝balloon \q 選択肢）</text>
