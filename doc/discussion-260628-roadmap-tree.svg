    <rect x="711" y="356" width="108" height="40" rx="5" fill="#fff" stroke="#FAC775"/><text x="765" y="374" text-anchor="middle" fill="#854F0B">mayuna-compose</text><text x="765" y="386" text-anchor="middle" font-size="6" font-family="sans-serif" fill="#BA7517">[M-mayuna]</text>
