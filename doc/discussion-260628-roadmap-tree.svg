<svg viewBox="0 0 940 582" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif">
  <title>areka M1 全7トラック（マウス制御=render・owner-draw=M2）</title>
  <desc>7トラック構造。⓪ghost-engine(owner) ①SHIORI通信層(host-32) ②parser/loader ③conductor ④sakura-engine ⑤shell-anim-engine ⑥render-engine。左がM-boot前提、右が増分(並走)。⑥renderが総合マウス制御を所有。owner-draw右クリックメニューはM2、M1メニューはballoon \q選択肢。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker>
  </defs>

  <text x="470" y="14" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">areka M1 全7トラック（⑥render＝総合マウス制御 owner ｜ owner-draw メニュー→M2）</text>

  <line x1="582" y1="30" x2="582" y2="476" stroke="#888780" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="360" y="28" text-anchor="middle" font-size="8.5" font-weight="700" fill="#5F5E5A">M-boot 前提（一度）</text>
  <text x="765" y="28" text-anchor="middle" font-size="8.5" font-weight="700" fill="#5F5E5A">M-boot 後（並走）</text>

