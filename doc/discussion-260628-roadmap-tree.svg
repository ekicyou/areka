    <rect x="474" y="166" width="102" height="40" rx="5" fill="#fff" stroke="#85B7EB"/><text x="525" y="189" text-anchor="middle">package-mount</text>
  </g>
  <text x="760" y="190" text-anchor="middle" font-size="7.5" font-style="italic" fill="#185FA5">— 増分なし（M-boot で完了）</text>

