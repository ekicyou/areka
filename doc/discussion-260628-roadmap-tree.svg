  <text x="94" y="69" text-anchor="middle" font-size="7" fill="#3B6D11">owner・全6を統括</text>
  <text x="94" y="80" text-anchor="middle" font-size="7" fill="#3B6D11">lifecycle/窓/永続化</text>
  <g font-size="6.8" font-family="monospace" fill="#3B6D11">
