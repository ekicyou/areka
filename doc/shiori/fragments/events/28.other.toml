[entry."OnTranslate"]
"kind" = "event"
"category" = "other"
"dispatch" = "get"
"response" = "sakura_script"
"provenance" = "ukadoc"
"description" = "SHIORIがMAKOTOのトランスレート機能を兼任するためのイベント。 主に、GETコマンドのSHIORI Eventに対してベースウェアへスクリプトが返却された場合に、それに応じて発行される。 OnTranslateの元となったSHIORI Eventに対して、SHIORI内部での操作を経てベースウェアへ返却されたスクリプトが、ベースウェアによる環境変数の展開などの後に再びSHIORIに送られる。SHIORIはこのスクリプトに対して再度何らかの処理を行ってベースウェアに最終的なスクリプトとして返却できる。 なおOnTranslate自身では再度発生しない。"
[entry."OnTranslate".field]
"original_script" = { "reference" = 0, "type" = "str", "required" = false, "provenance" = "ukadoc", "description" = "元のスクリプト。" }
"origin_kind" = { "reference" = 1, "type" = "str", "required" = false, "provenance" = "ssp_secondary", "description" = "※SSPのみ コミュニケートの場合、communicate。 SSTP SENDの場合、sstp-send。 Owned SSTPの場合、owned。 非ローカルSSTPの場合、remote。 トランスレートしない指定の場合、notranslate。 プラグインからのスクリプトの場合、plugin-script プラグインからのイベント反応の場合、plugin-event 該当するものがカンマ区切りで返る。※該当がない場合欠番となる。" }
"origin_event_id" = { "reference" = 2, "type" = "str", "required" = false, "provenance" = "ssp_secondary", "description" = "※SSPのみ このスクリプトが発生したイベントID 。イベントが原因ではない場合欠番。" }
"origin_references" = { "reference" = 3, "type" = "str", "required" = false, "provenance" = "ssp_secondary", "description" = "※SSPのみ バイト値1区切りの上記イベントのReference 。イベントが原因ではない場合欠番。" }

