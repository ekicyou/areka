# _shared.toml — areka-P0-shiori-protocol-split shared fragment.
# Aggregates the 4 shared tables (meta/mapping/envelope/reserved_headers)
# and all keyed silence_ruling. Generated deterministically; do not hand-edit.

["meta"]
"contract_version" = "0.x"
"prerelease" = true
"internal_encoding" = "utf-16"
"content_opaque" = true
"legacy_coemit_default" = true
"reference_immutable" = true
"high_rate_safe" = true
"description" = "SHIORI 正準 content プロトコル契約のメタ情報。プレリリース段階（prerelease=true）の流動契約であり後方互換保証を持たず、契約変更時は in-tree 全実装者を lockstep 更新する（D7 整合・要件 9.1/9.2）。正準 content の内部表現は常に UTF-16（HSTRING・shiori-com 整合）であり charset 概念を持たない。レガシー wire の charset byte 化は areka-P0-shiori-host-32 の責務であり、その既定 charset は ANSI コードページ（CP_ACP・ロケール依存。JP では CP932）であって Shift_JIS と決め打たない（要件 8.2）。content（さくらスクリプト/SAORI 引数）は不透明文字列として運び解釈/実行しない（content_opaque・要件 8.1/8.3）。レガシー wire では意味名エイリアスを既定併載し（legacy_coemit_default・要件 5.2/10.1）、Reference0/1/2… は消去/改名しない不変条件（reference_immutable・要件 5.4）。高レート通信余地（D6）を阻害しない封筒設計である旨を宣言する（high_rate_safe・要件 9.3）。"

["mapping"]
"single_source" = "entry.field"
"canonical_key" = "field_table_key"
"alias_key" = "reference"
"alias_variadic_key" = "reference_variadic"
"canonical_priority" = true
"separate_mapping_table" = false
"reference_backed_by" = ["reference", "reference_variadic"]
"description" = "意味名（canonical）⇔ReferenceN（alias）対応の正本規則を符号化する。【単一正本】対応の実体は [[entry.field]] 行 1 枚のみであり（single_source=entry.field・要件 3.1）、別の対応表テーブルは存在しない（separate_mapping_table=false・要件 3.2/10.2）。各 field 行において canonical（canonical_key=name）と alias（alias_key=reference・可変長末尾は alias_variadic_key=reference_variadic）は同一行から機械投影される 2 表示であり、同一行由来ゆえ常に同一値を指す（要件 3.2/10.2）。【canonical 優先】意味名と ReferenceN 解釈が食い違う場合は canonical（name）の解釈を優先する（canonical_priority=true・要件 3.4）。reference は導出 alias であり独立した権威を持たない（要件 3.3）。これは正本が field 行 1 枚である構造から従う。【ReferenceN 裏付け】全 field は reference（整数 N）または reference_variadic（可変長 Reference*）のいずれかで ReferenceN に裏付けられる（reference_backed_by・要件 2.2）。両者を併せ持つ field は固定開始 N＋可変長末尾を表す。本規則は 446 entry（287 event＋159 resource）の全 802 field を対象に成立し、全意味名は snake_case canonical であって PascalCase の [reserved_headers] 確定集合と非衝突である（case-sensitive・要件 6.1）。意味名が予約と衝突した場合の是正は [reserved_headers] collision_policy（rename_to_noncolliding）に従う（要件 6.2）。"

["envelope"]
"protocol" = "jsonrpc-2.0"
"method_source" = "event_id"
"params_style" = "named"
"correlation" = "token_eq_id"
"immediate_result" = "result"
"error_failure" = "error"
"deferred" = "id_then_result"
"raise_notification" = "notification_no_id"
"batch" = true
"description" = "正準 content の封筒は json-rpc 2.0（protocol=jsonrpc-2.0・要件 4.1）。各写像は areka-P0-shiori-com の内部 SHIORI ABI（IShiori/IShioriHost）意味論へ 1:1 対応する被せである。method は ukadoc イベント ID（method_source=event_id・要件 4.1）であり、ABI の Request に渡されるイベント ID が json-rpc method に一致する。params は意味名フィールドの named 形式（params_style=named・要件 4.1）。相関は CorrelationToken（u64）と json-rpc id を一意対応させる（correlation=token_eq_id・要件 4.5）。即時成功（IShiori::Request が S_OK＋応答 HSTRING を返す経路）は同一 id の result へ写す（immediate_result=result・要件 4.2）。失敗（error HRESULT を返す経路）は同一 id の error へ写す（error_failure=error・要件 4.2）。遅延（Request が SHIORI_S_PENDING＋相関トークンを返し、後に IShioriHost::Complete(token, response) で完了する経路）は先行して id を確定し後続で同一 id の result を配送する（deferred=id_then_result・要件 4.3）。Raise（IShioriHost::Raise(script) による能動通知）は id を持たない notification へ写す（raise_notification=notification_no_id・要件 4.4）。バッチ要求を許容し高レート通信余地（D6）を確保する（batch=true・要件 9.3）。本仕様は写像規約のみ定義し、配送機構は ABI／下流の責務。"

["reserved_headers"]
"request" = ["Charset", "Sender", "SenderType", "SecurityLevel", "SecurityOrigin", "Status", "ID", "BaseID", "Reference*", "X-SSTP-PassThru-*"]
"response" = ["Charset", "Sender", "Value", "ValueNotify", "SecurityLevel", "Marker", "ErrorLevel", "ErrorDescription", "BalloonOffset", "Reference*", "Age", "MarkerSend", "X-SSTP-PassThru-*"]
"collision_policy" = "rename_to_noncolliding"
"description" = "予約 SHIORI ヘッダ集合。意味名（entry.field.name）はこれらと衝突してはならない（要件 6.1）。衝突時は collision_policy=rename_to_noncolliding に従い非衝突名へ是正する（要件 6.2）。典拠は ukadoc/spec_shiori3.html の #request / #response 章であり、本集合はその ukadoc 範疇で定義される予約ヘッダの確定集合である（要件 6.1/11.4）。request は #request 章の各ヘッダ定義（Charset/Sender/SenderType/SecurityLevel/SecurityOrigin/Status/ID/BaseID/Reference*/X-SSTP-PassThru-*）から確定。Reference* は可変長 ReferenceN 系列（spec の『Reference の後には数字が入る。入れられる行数は制限なし』）を表すトークンで、field schema の reference_variadic と対応する。X-SSTP-PassThru-* は接頭辞可変ヘッダ族を表す。リクエスト行のメソッド（GET/NOTIFY）はヘッダではなく request-line のため非収録。response は #response 章の各ヘッダ定義（Charset/Sender/Value/ValueNotify/SecurityLevel/Marker/ErrorLevel/ErrorDescription/BalloonOffset/Reference*/Age/MarkerSend/X-SSTP-PassThru-*）から確定。レスポンスは Reference0 と Reference1～ が個別に記述されるが可変長系列として Reference* に統合した。ステータスコード（200/204/311/312/400/500）は status-line でありヘッダではないため非収録。本集合の確定責任は本仕様が所有し host-32 へ委譲しない（契約分散の回避）。"

[silence_ruling."sr_dispatch_dressup_changed"]
"topic" = "dispatch_class"
"basis" = "ukadoc_clause"
"ruling" = "OnDressupChanged は ukadoc が「複数同時通知の場合、一番最後の OnDressupChanged は [GET]、それ以外は [NOTIFY]」と文脈依存で記述する。正準カタログは単一 dispatch しか持てないため、応答（さくらスクリプト）を期待できる最後の通知＝[GET] を採用し dispatch=get と裁定する。意味変更の受け取りは ukadoc 指示どおり後続の OnNotifyDressupInfo を利用する。"
"ukadoc_anchor" = "list_shiori_event.html#OnDressupChanged"
"description" = "OnDressupChanged の文脈依存 GET/NOTIFY 分類（一番最後=[GET]/それ以外=[NOTIFY]）に対する裁定。topic=dispatch_class、basis=ukadoc_clause（ukadoc が両分類を明記）。応答可能な GET を正準採用した根拠を記録する。entry の silence_ref から参照される。"

[silence_ruling."sr_dispatch_cache_unmarked_notify"]
"topic" = "dispatch_class"
"basis" = "ukadoc_clause"
"ruling" = "OnCacheSuspend / OnCacheRestore（ゴーストキャッシュへの退避・復帰の通知）は既定の GET 想定（無印=GET の既定規則）と異なり、ukadoc の当該 dl ブロックが [NOTIFY] でくくられた通知系イベントである。応答を期待しない一方向通知として dispatch=notify・response=none を採用する。"
"ukadoc_anchor" = "list_shiori_event.html#OnCacheSuspend"
"description" = "OnCacheSuspend/OnCacheRestore の通知系分類に対する裁定。既定 GET からの逸脱を、ukadoc の [NOTIFY] グルーピングを典拠に notify 採用とする（basis=ukadoc_clause、topic=dispatch_class）。両 entry の silence_ref から参照される。"

[silence_ruling."sr_dispatch_status_notify_other_get"]
"topic" = "dispatch_class"
"basis" = "ukadoc_clause"
"ruling" = "OnSpeechSynthesisStatus / OnVoiceRecognitionStatus は ukadoc が [NOTIFY/他GET] と表記する文脈依存イベント（起動時や一斉通知では NOTIFY、その他文脈では GET）。状態変化の一方向通知としての性格が主であるため dispatch=notify・response=none を正準採用し、GET 文脈は本裁定で別扱いとして記録する。"
"ukadoc_anchor" = "list_shiori_event.html#OnSpeechSynthesisStatus"
"description" = "OnSpeechSynthesisStatus/OnVoiceRecognitionStatus の [NOTIFY/他GET] 文脈依存分類に対する裁定。notify を正準採用した根拠を記録（basis=ukadoc_clause、topic=dispatch_class）。両 entry の silence_ref から参照される。"

[silence_ruling."sr_dispatch_othersurfacechange_notify"]
"topic" = "dispatch_class"
"basis" = "areka_discretion"
"ruling" = "OnOtherSurfaceChange は ukadoc が GET/NOTIFY マーカーを明示せず（標準では無効・要 set othersurfacechange=true）、文面は「通知されます」と一方向通知の意味づけのみを与える。応答期待の明示が沈黙しているため、通知意味に従い areka 裁量で dispatch=notify・response=none を採用する。"
"ukadoc_anchor" = "list_shiori_event.html#OnOtherSurfaceChange"
"description" = "OnOtherSurfaceChange の GET/NOTIFY 無印（応答期待沈黙）に対する裁定。通知意味づけを根拠に areka 裁量で notify 採用（basis=areka_discretion、topic=dispatch_class）。entry の silence_ref から参照される。"

[silence_ruling."sr_dispatch_os_startup_notify_other_get"]
"topic" = "dispatch_class"
"basis" = "ukadoc_clause"
"ruling" = "OS 状態系（OnDisplayChange/OnDisplayChangeEx/OnBatteryNotify/OnTabletMode/OnDarkTheme/OnOSUpdateInfo/OnRecycleBinStatusUpdate/OnLanguageChange）は ukadoc が「起動直後/一斉通知は NOTIFY（応答なし）、変化発生時は GET（応答可）」という文脈依存分類を与える。変化通知に応答できる GET 文脈を正準採用し dispatch=get とする。OnLanguageChange は起動時通知が必ず NOTIFY でイベントに応答できない旨も明記されるが、設定変更通知の GET 文脈を正準とする本家族裁定に含める。"
"ukadoc_anchor" = "list_shiori_event.html#OnDisplayChange"
"description" = "OS 状態系イベント群の「起動時NOTIFY/変化時GET」文脈依存分類に対する家族裁定。応答可能な GET を正準採用した根拠を記録（basis=ukadoc_clause、topic=dispatch_class）。対象 8 entry の silence_ref から参照される。"

[silence_ruling."sr_dispatch_displayhandover_notify_other_get"]
"topic" = "dispatch_class"
"basis" = "ukadoc_clause"
"ruling" = "OnDisplayHandover（スクリーン間のウインドウ移動通知）は ukadoc が [NOTIFY/他GET] と表記する文脈依存イベント。位置確定/移動の一方向通知としての性格が主であるため dispatch=notify・response=none を正準採用する。"
"ukadoc_anchor" = "list_shiori_event.html#OnDisplayHandover"
"description" = "OnDisplayHandover の [NOTIFY/他GET] 文脈依存分類に対する裁定。notify を正準採用した根拠を記録（basis=ukadoc_clause、topic=dispatch_class）。entry の silence_ref から参照される。"

[silence_ruling."sr_response_inputcancel_silent"]
"topic" = "dispatch_class"
"basis" = "areka_discretion"
"ruling" = "*InputCancel 系（OnTeachInputCancel/OnCommunicateInputCancel/OnUserInputCancel）は入力ボックスのキャンセル発生イベントだが、ukadoc が応答期待（GET/NOTIFY 分類）を明示せず沈黙する。これらは入力フローの一部でゴーストが応答さくらスクリプトを返し得るため、areka 裁量で他の input 系イベントに倣い dispatch=get・response=sakura_script を既定採用する。"
"ukadoc_anchor" = "list_shiori_event.html#OnUserInputCancel"
"description" = "*InputCancel 系の応答期待沈黙に対する裁定。input 系の既定（get/sakura_script）を areka 裁量で採用した根拠を記録（basis=areka_discretion、topic=dispatch_class）。対象 3 entry の silence_ref から参照される。"

[silence_ruling."sr_meaning_mouseclick_wheel_delta"]
"topic" = "meaning_assignment"
"basis" = "areka_discretion"
"ruling" = "OnMouseClick/OnMouseClickEx の Reference2 は ukadoc 記述が「常に0」で固定値（意味なしダミー）だが、同形のマウス系イベント OnMouseWheel/OnMouseMove では Reference2 が wheel_delta（ホイール回転量）を担う。位置（Reference 番号）整合と意味名の一貫性を優先し、Click/ClickEx の Reference2 にも wheel_delta を意味名割り当てする（値は常に 0）。常に 0 の固定意味を明示する OnMouseWheel/OnMouseMove の Reference5（always_zero）とは対照的に、Click 側は位置整合のため wheel_delta 命名を採る areka 裁量裁定である。"
"ukadoc_anchor" = "list_shiori_event.html#OnMouseClick"
"description" = "OnMouseClick/OnMouseClickEx の Reference2（ukadoc「常に0」）への意味名割り当てに対する裁定。マウス系の Reference 位置整合を優先し wheel_delta 命名を採用（basis=areka_discretion、topic=meaning_assignment）。両 entry の wheel_delta field の silence_ref から参照される。"

[silence_ruling."sr_dispatch_network_dedup"]
"topic" = "dispatch_class"
"basis" = "areka_discretion"
"ruling" = "ネットワーク状態系 OnNetworkHeavy / OnNetworkStatusChange は ukadoc が GET/NOTIFY マーカーを明示せず分類が沈黙する。両者とも応答可能なイベントとして扱える（重い通信の警告・接続状態変化の通知に対しゴーストが応答さくらスクリプトを返し得る）ため、areka 裁量で dispatch=get・response=sakura_script を採用する。両イベントは似た網羅範囲を持つため一裁定へ集約（重複裁定の整理）する。"
"ukadoc_anchor" = "list_shiori_event.html#OnNetworkStatusChange"
"description" = "OnNetworkHeavy/OnNetworkStatusChange の GET/NOTIFY 無印（分類沈黙）に対する裁定。get/sakura_script を areka 裁量で採用し両イベントを一裁定へ集約（basis=areka_discretion、topic=dispatch_class）。両 entry の silence_ref から参照される。"
