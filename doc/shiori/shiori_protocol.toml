[[entry]]
id = "OnTranslate"
kind = "event"
category = "other"
dispatch = "get"
response = "sakura_script"
provenance = "ukadoc"
description = "SHIORIがMAKOTOのトランスレート機能を兼任するためのイベント。 主に、GETコマンドのSHIORI Eventに対してベースウェアへスクリプトが返却された場合に、それに応じて発行される。 OnTranslateの元となったSHIORI Eventに対して、SHIORI内部での操作を経てベースウェアへ返却されたスクリプトが、ベースウェアによる環境変数の展開などの後に再びSHIORIに送られる。SHIORIはこのスクリプトに対して再度何らかの処理を行ってベースウェアに最終的なスクリプトとして返却できる。 なおOnTranslate自身では再度発生しない。"

