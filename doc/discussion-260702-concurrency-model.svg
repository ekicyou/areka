<svg viewBox="0 0 880 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif">
  <title>areka 並行モデル 2026-07-02（アクター/スレッド/チャンネル・固有名）</title>
  <desc>各エンジン=独立スレッドのアクター、channelで通信。ghostがowner。shiori(host-32)は別プロセス(IPC=WM_COPYDATA・跨ぐのは生バイト列のみ・ipc完了)。kanade→sakura→seriko→emo と text直接。emo→kanadeへ入力。emoはUIスレッド固定(D2D/WUC単一・windowアフィニティ・WUCはMTA+DQTAT_COM_NONE実測)。parsersはload-timeでactorでない(全完了)。</desc>

  <defs>
    <marker id="ch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#534AB7"/></marker>
    <marker id="own" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker>
  </defs>

  <text x="440" y="16" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2C2C2A">areka 並行モデル 2026-07-02 — エンジン＝独立スレッドのアクター・channel 通信</text>

  <g stroke="#534AB7" stroke-width="1.8" fill="none" font-family="sans-serif">
    <path d="M265,134 L348,132" marker-end="url(#ch)" marker-start="url(#ch)"/>
    <path d="M442,158 L442,194" marker-end="url(#ch)"/>
    <path d="M360,244 C320,262 300,268 288,282" marker-end="url(#ch)"/>
    <path d="M470,244 L470,376" marker-end="url(#ch)"/>
    <path d="M300,332 C320,352 348,360 372,376" marker-end="url(#ch)"/>
    <path d="M626,378 C660,300 600,170 537,140" marker-end="url(#ch)"/>
  </g>
  <g font-size="7" fill="#534AB7" font-weight="700">
    <text x="306" y="118" text-anchor="middle">IPC: WM_COPYDATA</text>
    <text x="306" y="127" text-anchor="middle" font-size="6.2">event ↔ Value（跨ぐのは生バイト列のみ）</text>
    <text x="455" y="180" text-anchor="middle">script ch</text>
    <text x="300" y="266" text-anchor="middle">surface cmd(\s)</text>
    <text x="486" y="320" text-anchor="middle">text ch</text>
    <text x="318" y="372" text-anchor="middle">surface frame</text>
    <text x="640" y="250" text-anchor="middle">input/hit ch</text>
  </g>

  <path d="M440,74 L442,108" stroke="#888780" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#own)"/>
  <text x="476" y="92" font-size="6.8" fill="#888780">spawns/owns 全 actor</text>

  <rect x="330" y="32" width="220" height="42" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.6"/>
  <text x="440" y="50" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3B6D11">⓪ ghost</text>
  <text x="440" y="64" text-anchor="middle" font-size="7.5" fill="#3B6D11">owner thread（全 actor を spawn・統括）</text>

  <rect x="50" y="104" width="215" height="66" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="157" y="124" text-anchor="middle" font-size="9.5" font-weight="700" fill="#993C1D">① shiori（host-32）</text>
  <text x="157" y="137" text-anchor="middle" font-size="7.3" fill="#993C1D">別プロセス（天然の actor 境界）</text>
  <text x="157" y="149" text-anchor="middle" font-size="6.8" fill="#993C1D">＋自前 msg pump（窓持ち SHIORI）</text>
  <text x="157" y="162" text-anchor="middle" font-size="6.6" font-style="italic" fill="#2E7D32">32bit pasta.dll を飼う ｜ ipc ✅（3クレート）</text>

  <rect x="350" y="110" width="186" height="48" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="1.5"/>
  <text x="443" y="130" text-anchor="middle" font-size="9.3" font-weight="700" fill="#993556">③ kanade（conductor）</text>
  <text x="443" y="145" text-anchor="middle" font-size="7.3" fill="#993556">worker thread・SHIORI 循環</text>

  <rect x="350" y="196" width="186" height="48" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="443" y="216" text-anchor="middle" font-size="9.3" font-weight="700" fill="#0F6E56">④ sakura</text>
  <text x="443" y="231" text-anchor="middle" font-size="7.3" fill="#0F6E56">worker・per-talk transient</text>

  <rect x="160" y="284" width="210" height="48" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="265" y="304" text-anchor="middle" font-size="9.3" font-weight="700" fill="#854F0B">⑤ seriko（shell-anim）</text>
  <text x="265" y="319" text-anchor="middle" font-size="7.3" fill="#854F0B">worker thread・SERIKO ループ</text>

  <rect x="300" y="376" width="340" height="88" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="2.4"/>
  <text x="470" y="397" text-anchor="middle" font-size="9.8" font-weight="700" fill="#26215C">⑥ emo（render）＝ UI スレッド（固定）</text>
  <text x="470" y="412" text-anchor="middle" font-size="7.5" fill="#3C3489">D2D 単一スレッド ＋ window アフィニティ ＝ 非対称</text>
  <text x="470" y="426" text-anchor="middle" font-size="7.5" fill="#3C3489">他 actor は描画/入力を channel で emo へ</text>
  <text x="470" y="440" text-anchor="middle" font-size="7.3" font-weight="700" fill="#534AB7">surface＋text 合成 ＋ 総合マウス制御</text>
  <text x="470" y="455" text-anchor="middle" font-size="6.8" font-style="italic" fill="#2E7D32">合成 backend＝WUC 移行済 ✅（MTA UI スレッド＋DQTAT_COM_NONE 実測・DispatcherQueue 親和）</text>

  <rect x="40" y="376" width="235" height="88" rx="8" fill="#F1EFE8" stroke="#85B7EB" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="157" y="396" text-anchor="middle" font-size="9" font-weight="700" fill="#185FA5">② parsers</text>
  <text x="157" y="410" text-anchor="middle" font-size="7.3" fill="#185FA5">load-time（actor でない）</text>
  <text x="157" y="423" text-anchor="middle" font-size="7.3" fill="#185FA5">構築時に1度走る・スレッド常駐せず</text>
  <text x="157" y="436" text-anchor="middle" font-size="6.8" font-style="italic" fill="#378ADD">出力＝各エンジンの構築入力（転記層）</text>
  <text x="157" y="452" text-anchor="middle" font-size="7.2" font-weight="700" fill="#2E7D32">✅ 全完了（foundation＋4 parsers）</text>

  <g font-size="8" fill="#5F5E5A">
    <line x1="690" y1="392" x2="720" y2="392" stroke="#534AB7" stroke-width="1.8" marker-end="url(#ch)"/><text x="726" y="395">channel</text>
    <line x1="690" y1="410" x2="720" y2="410" stroke="#888780" stroke-width="1.3" stroke-dasharray="4 3"/><text x="726" y="413">所有/プロセス境界</text>
    <text x="690" y="432" font-size="7.5">async 中心でなく</text>
    <text x="690" y="443" font-size="7.5">スレッド独立挙動</text>
    <text x="690" y="460" font-size="7.2" fill="#2E7D32">✅＝2026-07-02 完了</text>
  </g>

  <text x="440" y="496" text-anchor="middle" font-size="7.8" fill="#5F5E5A">I/O 契約＝channel メッセージ型（region/actor・\q/選択・2窓/surface・\![move]）｜ HGLOBAL=32bit ローカル／HSTRING=x64 ローカル＝各プロセス自前通貨・プロセス境界を跨がない</text>
  <text x="440" y="514" text-anchor="middle" font-size="7.8" fill="#5F5E5A">固有名＝ghost / shiori / parsers / kanade / sakura / seriko / emo（2026-07-02 確定・正本 roadmap.md）</text>
</svg>
