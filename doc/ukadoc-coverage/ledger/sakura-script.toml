status = "degraded"
introduced = ""
owner = ""
priority = ""
values = []
links = []
note = """
壊れ方: 見た目の差 — MoveCueSink::emit が名前の完全一致で自分を選び、parse_move_directive が位置引数の形を解いて実窓を動かす。動く用法＝位置引数で書き、基準に数値スコープを使い、時間を省くか 0 にする形。動かない用法＝⑴ 名前付きの --key=value 形（正典の記述例そのものの書き方）は解釈が Err になり記録付きで読み飛ばされて窓が動かない ⑵ 基準 screen・primaryscreen・me・global は縮退として記録され、数値スコープ基準しか解かれない ⑶ 時間指定が 0 より大きいときも補間せず最終位置へ即時に飛ぶ。
ログ: 出る（名前付き形は emit の Err の腕が warn!、非スコープ基準と座標算出不能は適用側が warn!、担当外の名前は debug!）。
[転記元: doc/COMPAT_ARCHITECTURE.md の「\\![move] の名前付き --key=value 形」「\\![move] の基準 screen／primaryscreen／me／global」「\\![move] の時間指定 time>0（アニメーション付き移動）」の 3 行]
[版: カタログの規則で拾える版番号は無い。本文に現れる 2.5 は記述例の「2.5 秒かけて移動する」という所要時間であって版番号ではないので、本文が 2 桁の版を書いている項目には数えない]
"""

