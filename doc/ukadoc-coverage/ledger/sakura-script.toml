[entry."ukadoc:list_sakura_script:_5c_21_5bbind_2c_30ab_30c6_30b4_30ea_540d_2c_30d1_30fc_30c4_540d_2c_6570_5024_5d:1"]
status = "implemented"
introduced = ""
owner = ""
priority = ""
values = []
links = []
note = """
壊れ方: 見た目の差 — areka-seriko の handle_message がキャリアを開いて名前の完全一致で自分を選び、parse_bind_directive の適用形（カテゴリ名・パーツ名・0 か 1 の数値がそろう形）を着せ替えの着脱として実際に反映する。
ログ: 出る（トグル形とカテゴリ単位形は M1 未実導出として warn!、カテゴリ欠落や on/off 値の破損は error!、担当外の名前は debug!）。
[未登記の食い違い: 正典は「パーツ名を空欄にするとカテゴリ単位の動作」「数値欄を空欄または省略すると ON/OFF の繰り返し」と定めるが、handle_message はどちらも正当構文のまま warn! で読み飛ばす。doc/COMPAT_ARCHITECTURE.md にこの縮退を登記した行が無いので、DD-8 により状態を動かさず是正候補として出す]
"""

