[entry."ukadoc:descript_shell:kero.defaultleft_2cX_5ea7_6a19:1"]
status = "absent"
introduced = ""
owner = ""
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。記録: なし。areka の placement::config::resolve_scope は `defaultx` と `defaultleft` を同じ 1 つの欄へ、`defaulty` と `defaulttop` を同じ 1 つの欄へ写し、先に書いてある方を採るだけである。正典は `defaultx`／`defaulty` を画像を基準にした座標、`defaultleft`／`defaulttop` を画面上の座標と別々に定めているので、基準点の違いが失われる。画面上の座標として解く枝が無いので、書いても正典どおりの位置には立たない。沈黙ルール対応表と見直し表のすべての行を当たったが、この食い違いを引き受ける行は無い（開発者裁定 2026-09-05 の 2 つ目の枝＝未対応）。
"""

