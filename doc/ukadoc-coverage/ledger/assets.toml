[entry."ukadoc:descript_shell:kero.balloon.offsetx_2c_5ea7_6a19:1"]
status = "absent"
introduced = "2.4.58"
owner = ""
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。記録: なし。areka の placement::config::resolve_scope は横と縦の両方が書かれているときだけ調整量を作り、横だけを書いた宣言は何も言わずに捨てる（2 つを組にしてから初めて値にするため）。正典は 1 軸だけの宣言も意味を持つ座標として定めている。このキーを名指しする行は沈黙ルール対応表にある——「キーワード指定時に `windowposition.y` などの調整量をどう扱うか」は、バルーンの基本位置をキーワードで決めたときにも調整量の加算を続けるかどうかに答えており（担当は areka-P0-windowposition-limit）、「バルーン位置オフセットの単位空間契約」は、作者が書いた値をどの拡大率の軸で物理 px へ換算して持つかに答えている（担当は areka-P0-balloon-offset-dpi）。どちらも「片方だけの宣言が落ちること」には答えていない。本台帳が未対応として記録するのはその食い違いであり、これを引き受ける行は沈黙ルール対応表にも見直し表にも無い（開発者裁定 2026-09-05 の 2 つ目の枝＝未対応）。
"""

