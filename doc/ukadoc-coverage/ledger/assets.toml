同じ名前の見出しがゴースト・シェル・プラグインの descript にもあり、SHIORI の資源の側にも同名の項目がある（そちらは別ドメインの台帳の持ち物で、areka-sylphya の vocab::shiori_resource が語彙として持っている）。名前で引かず、ページを決めてから引くこと。
両方の表のすべての行を当たったが、この欄を名指しで引き受ける行は無い。
