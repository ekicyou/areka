[entry."ukadoc:descript_shell:char_2a.defaultleft_2cX_5ea7_6a19:1"]
status = "absent"
introduced = ""
owner = "areka-P0-window-placement"
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。記録: なし。
areka は `defaultleft` を `defaultx` と区別しない。
areka は横に 1 つ・縦に 1 つの欄しか持たず、`defaultx` と `defaultleft` を同じ横の欄へ、`defaulty` と `defaulttop` を同じ縦の欄へ畳んで、先に書いてある方を採る（areka の placement::config::resolve_scope）。畳んだ後にどう解くかは机上の揃えだけで決まる——既定（下端）のときは横を連鎖の基準からの左方向のずらし量として使い、縦は丸ごと捨てる。`free` のときは横も縦も作業領域の左上を原点とする画面上の座標として使う（areka の placement::resolver）。つまり、どちらの綴りで書いたかは結果に効かない。
正典は `defaultleft` を画面上の X 座標と定めている。areka が画面上の座標として解くのは揃えが `free` のときだけで、既定（下端）のときは連鎖の基準からのずらし量として使ってしまう。同じ descript に `defaultx` も書いてあれば、そちらが先に採られてこの欄は黙って落ちる。
沈黙ルール対応表と見直し表のすべての行を当たったが、この欄を名指しで引き受ける行は無い（開発者裁定 2026-09-05 の 2 つ目の枝＝未対応）。
`charN.` の綴りは、値の行き先のほかにキャラクタの人数にも効く。areka の placement::config::detect_scopes は起点とシェルの両方の表を走査し、`charN.` で始まるキーの番号が 2 以上のときだけ（番号の取り出しは areka の placement::config::char_scope_of）そのキャラクタを立てる。番号が 0 と 1 の綴りは本体と相方の別名という扱いで、人数の数え上げには効かない——値のほうは、番号が 0 なら本体の欄として、番号が 1 なら相方が立っているときにかぎり相方の欄として受け取られる（areka の placement::config::scope_prefixes と placement::config::scoped_value）。
担当 spec は areka-P0-window-placement。同 spec の brief は既定の置き場所を建てる範囲として `defaultx`／`defaulty` の解決を design の対象に含めると書き、`defaultx` と `defaultleft` の関係を確かめて両表記を受ける寛容な実装にせよとも書いている（`defaulttop` は「揃えが `free` のときだけ有効」と正典から引いて読むべき欄に挙げている）。
"""

