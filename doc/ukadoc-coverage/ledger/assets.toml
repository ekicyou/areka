正典は `defaulty` を画像を基準にした Y 座標（既定は画像の下端）と定めており、揃えを問わない。areka はこれを画像基準として解く枝を持たず、既定の揃えでは捨て、`free` では画面上の座標として使う。どちらも正典の言う基準ではない。
