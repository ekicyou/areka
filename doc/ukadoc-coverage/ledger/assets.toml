[entry."ukadoc:descript_ghost:name.allowoverride_2c_6570_5024:1"]
status = "absent"
introduced = ""
owner = ""
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。記録: なし。
areka はシェル側の名前で上書きしてよいかの宣言を受け取る経路を持たない。
ゴーストの descript から areka が引くのは、areka-parsers の package::resolve が読む名前の欄と SHIORI のファイル名とシェルの置き場所の名前、同じクレートの charset::prescan_charset が読む文字コードの宣言、そして areka の placement::config::resolve_scope が読む窓の置き方の欄だけである。この欄はそのどれにも入っていないので、読まれることも記録が出ることもない。
正典はこの欄の既定を「シェル側の `sakura.name`／`kero.name` を使う」と定めているが、areka は名前をゴーストの descript からしか採らない（areka-parsers の package::resolve）。シェルの descript を読むのは areka-ghost の config::resolve_shell_name で、そこが引くのは `name` の欄だけである。つまり areka は宣言の有無にかかわらず、常に上書きしない側の振る舞いをする。
これが名前の族でゴースト側とシェル側の状態が割れる理由である——ゴーストの descript の `sakura.name`／`sakura.name2`／`kero.name` は読まれて実装済み、シェルの descript の同じ綴りは名前としては読まれない。シェルの `name`（シェル名）だけは起動時のシェル名という別の用途で読まれており実装済みである。バルーンの descript の `name`（バルーン名）はどこからも読まれない。名前で引かず、ページを決めてから引くこと。
両方の表のすべての行を当たったが、この欄を名指しで引き受ける行は無い。
完了 spec の areka-P0-sylphya は、この欄の解決規則をどの spec が持つかを未決のまま残している。担当は決まっていない。
"""

