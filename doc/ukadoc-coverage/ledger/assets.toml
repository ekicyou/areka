note = """
壊れ方: 黙って壊れる。記録: なし。areka の placement::config::resolve_scope は `defaultx` と `defaultleft` を同じ 1 つの欄へ、`defaulty` と `defaulttop` を同じ 1 つの欄へ写し、先に書いてある方を採るだけである。正典は `defaultx`／`defaulty` を画像を基準にした座標、`defaultleft`／`defaulttop` を画面上の座標と別々に定めているので、基準点の違いが失われる。さらに縦の値は、机上の揃えが既定（下端）のときは placement::resolver が丸ごと無視し、`free` のときしか効かない。沈黙ルール対応表と見直し表のすべての行を当たったが、この食い違いを引き受ける行は無い（開発者裁定 2026-09-05 の 2 つ目の枝＝未対応）。
"""

[entry."ukadoc:descript_shell:char_2a.defaultx_2cX_5ea7_6a19:1"]
status = "absent"
introduced = ""
owner = ""
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。記録: なし。areka の placement::config::resolve_scope は `defaultx` と `defaultleft` を同じ 1 つの欄へ写し、先に書いてある方を採るだけである。横の値の使い道そのものには裁定がある——沈黙ルール対応表の「複数スコープの既定 X 連鎖規則」が `defaultx` を名指しし、連鎖の基準からの左方向オフセット（0＝基準密着）として扱うことを意味論不変と決めている（担当は areka-P0-scope-chain-gap）。本台帳が未対応として記録する食い違いはそれとは別で、`defaultleft` との基準点の違いが失われることである——正典は `defaultx` を画像を基準にした X 座標（既定は画像中央の X）、`defaultleft` を画面上の X 座標と別々に定めているのに、areka は 2 つを区別せず同じ欄へ畳む。この食い違いを引き受ける行は、沈黙ルール対応表にも見直し表にも無い（開発者裁定 2026-09-05 の 2 つ目の枝＝未対応）。
"""

