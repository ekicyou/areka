[entry."ukadoc:descript_shell:kero.balloon.offsetx_2c_5ea7_6a19:1"]
status = "absent"
introduced = "2.4.58"
owner = "areka-P0-balloon-offset-dpi"
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。記録: なし。
areka は横だけを書いたバルーンのずらし量の宣言を黙って捨てる。
areka の placement::config::resolve_scope は横と縦の両方が書かれているときだけ調整量を作る（2 つを組にしてから初めて値にする）。正典は 1 軸だけの宣言も意味を持つ座標として定めている。
もう 1 つ落ちるものがある——正典は綴りの後ろに `l`／`r` を付けた形（例 `offsetxr`）で左右に出すときのずらし量を別々に書けると定めているが、areka が照合するのは接尾辞の無い綴りだけで、付いた形はどこからも引かれない。
このキーを名指しする行は沈黙ルール対応表にある——「キーワード指定時に `windowposition.y` などの調整量をどう扱うか」は、バルーンの基本位置をキーワードで決めたときにも調整量の加算を続けるかどうかに答えており（担当は areka-P0-windowposition-limit）、「バルーン位置オフセットの単位空間契約」は、作者が書いた値をどの拡大率の軸で物理 px へ換算して持つかに答えている（担当は areka-P0-balloon-offset-dpi）。どちらも「片方だけの宣言が落ちること」には答えていない。本台帳が未対応として記録するのはその食い違いであり、これを引き受ける行は沈黙ルール対応表にも見直し表にも無い（開発者裁定 2026-09-05 の 2 つ目の枝＝未対応）。
`kero.` で始まるキーは、値のほかにもう 1 つ効き目を持つ——その綴りがシェルの descript にあること自体を、相方の有無を決める areka の placement::config::detect_scopes が材料にする。
担当 spec は areka-P0-balloon-offset-dpi。同 spec の brief は範囲の In にシェルの descript のこの欄の拡大率の当て方をそろえることを挙げている。
"""

