note = """
壊れ方: 黙って壊れる。記録: なし。
areka はバルーンの初期表示面の宣言を受け取る経路を持たず、どのバルーンも面 ID 0 の絵から出す（面 ID 0 が必ずあることを areka-emo-present の balloon::resolve_balloon_faces が施行し、その先頭の面がそのまま最初の見た目になる）。
ゴーストの descript から areka が引くのは、areka-parsers の package::resolve が読む名前の欄と SHIORI のファイル名とシェルの置き場所の名前、同じクレートの charset::prescan_charset が読む文字コードの宣言、そして areka の placement::config::resolve_scope が読む窓の置き方の欄だけである。この欄はそのどれにも入っていないので、読まれることも記録が出ることもない。
沈黙ルール対応表の `ghost descript の balloon.defaultsurface / kero.balloon.defaultsurface / char*.balloon.defaultsurface による初期表示面宣言` の行が、正典の既定である面 ID 0 だけを実装した状態を非追従として引き受けている。ただし areka にはこの欄を受け取る経路そのものが無いので、状態は縮退ではなく未対応とした（受け取る経路が無い項目は転記元の行があっても未対応とする裁定）。
担当 spec は areka-P0-balloon-canon-residue（brief が番号を付けている項目のうち、バルーンの初期面を指定する語彙の非追従を扱う項目）。
"""

