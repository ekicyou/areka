owner = "areka-P0-window-placement"
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。記録: warn!。areka が実際に導出するのは `bottom` と `free` の 2 つだけで、正典の `top`／`left`／`right` はいずれも記録を残したうえで `bottom` と同じ置き方になる（areka の placement::config の `Alignment::Seam` と placement::resolver の警告）。書いた作者の意図とは違う場所にゴーストが立つので、受理しているが正典どおりには動かない。沈黙ルール対応表と見直し表のすべての行を当たったが、この食い違いを引き受ける行は無い（開発者裁定 2026-09-05 の 2 つ目の枝＝未対応）。
同じ名前の見出しがゴーストの descript にもある。areka は両方の表を読み、シェル側がゴースト側に勝ち、スコープを名指しした欄が全体の欄に勝つ重ね方（areka の placement::config::resolve_scope）で 1 つに決める。id は別なので同一視せず、名前で引かず、ページを決めてから引くこと。
1 つ補いがある——値の導出は上のとおり縮んでいるが、`kero.` で始まるキーがシェルの descript にあること自体は捨てられていない。相方の有無を決める areka の placement::config::detect_scopes がその綴りの有無を材料にする。
担当 spec は areka-P0-window-placement。同 spec の brief は既定の置き場所をこの欄の重ね方で解くことを自分の範囲に挙げ、ゴーストとシェルの両方にこの欄が書けることも読むべき正典として名指ししている。
"""

