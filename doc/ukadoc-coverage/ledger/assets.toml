[entry."ukadoc:descript_shell_surfaces:_2a_2c_5b_2a_5d:1"]
status = "absent"
introduced = ""
owner = "areka-P0-shell-parse"
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。記録: なし。areka-parsers の shell::decode_alias_block と shell::parse_alias_ids がこの形の行を名前と順序付きの番号の並びとして値にし、areka-emo-compose の world が別名の表として持ち、areka-seriko の resolve が `\\s[名前]` の名前を面の番号へ写す。受け取る道はある。
正典どおりでないところが 3 つある。⑴ 番号を複数書いたとき、正典はその中から毎回どれかを選ぶと定めるが、areka-seriko の resolve::SurfaceResolver は並びの先頭を固定で返す（決定論を優先した作りである）。同じ名前を書いても、いつも同じ 1 枚しか出ない。⑵ 塊の名前として areka が振り分けるのは相方側の綴りだけで、本体側の綴り（`sakura.surface.alias`）とキャラクタ番号で指す綴りは crates のどの Rust ファイルにも出てこない——本体側に別名を書いたゴーストは、その別名が丸ごと落ちる。⑶ 正典は別名を専用のファイル（`alias.txt`）に分けて書くこともできると定めるが、その綴りも crates のどこにも無く、読む道が無い。
⑵ と ⑶ はどちらも記録を残さない。⑵ は areka-parsers の shell::dispatch_block が未知の塊として吸収するだけである。areka-parsers の shell モジュールには記録の呼び出しが 1 つも無いので、落としたことはどこにも残らない。
2 つの表を当たったが、この食い違いを引き受ける行はどちらにも無い（開発者裁定 2026-09-05 の 2 つ目の枝＝未対応）。適合の対象としたゴーストが相方側の綴りしか使わないので、いままで表に出ていない。
担当 spec は areka-P0-shell-parse。同 spec の brief は範囲の In に別名の透過（名前は解釈せず不透明に扱う）を挙げている。
"""

