note = """
壊れ方: 黙って壊れる。記録: なし。この項目はページ 1 枚をまとめて指す粗い粒度で、ページの中の記述を 1 つずつ分けて持っていない。ページは着せ替えの設定一式（surfaces.txt 側の定義と、シェルの descript.txt 側のメニュー配置）を定める。areka が起動時の初期集合を emo2_boot::assets::default_bind_ids で組むところまでで、利用者が着せ替えを選ぶ入口であるオーナードローメニューが無いため、ページ全体としては満たしていない。ベースウェアの違いに触れる注記があるが、SSP でも有効な記述なので対象外にはしない。
担当は空。配布者向けのページで、要件 7.2 が名指しする担当 spec にも設計が足した 2 本にも、ページ 1 枚をまとめて引き受ける spec は無い。担当の割り当ては areka-P0-ukadoc-coverage-roadmap に委ねる。
関連の向き: 正典の本文が相手のページを名指しで指しているとき、指している側にだけ関連を置き、指されている側には戻りの関連を置かない。このページが名指しで指しているのは「シェルの作成」のページだけで、アニメーションの設定そのものの説明をそちらに預けている。これを関連に置いた。着せ替えをメニューへ出す話を書いている「オーナードローメニューの設定」のページは、あちらがこのページを名指しで指している側なので、関連はあちらにある。
"""

