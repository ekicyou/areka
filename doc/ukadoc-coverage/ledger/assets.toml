[entry."ukadoc:descript_balloon:font.name_2c_30d5_30a9_30f3_30c8_540d:1"]
status = "absent"
introduced = ""
owner = "areka-P0-text-decoration-canon"
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。記録: なし。
areka-parsers の balloon::map_merged が完全一致で引いて文字列のまま持ち上げ、areka-emo-text の draw::ResolvedFont が書体の設定として解く。先頭の書体名だけは効くが、正典が SSP の機能として定める 2 つが成り立たない。
⒜ バルーンのフォルダに置いたフォントファイルは指定できない。書体の生成（areka-emo-text の draw::create_text_format）は書体の集まりを渡さないためシステムに入っている書体しか解けず、ファイルを足す経路はリポジトリのどこにも無い。
⒝ カンマ区切りの優先列が効かない。areka-emo-text の draw::ResolvedFont::resolve はカンマで切って先頭の名前を無条件に採り、その書体がインストールされているかを見ない。残りの名前は保持するだけで読む側がいない。先頭の書体が無い環境では、作者が次に書いた候補ではなく、書体の解決に任せた別の書体で描かれる。
どちらも記録は残らない。両方の表のすべての行を当たったが、この食い違いを引き受ける行は無い。
縦書き用の字形が無いフォントを標準ゴシックへ差し替えるという決まりは、正典ではこの項目ではなく vertical の項目の説明の中に書かれている（2026-09-05 にライブの正典で確認）ため、その食い違いは vertical の項目に登記した。
担当 spec は areka-P0-text-decoration-canon。担当 spec の brief はバルーンの font 系を 13 キーと書くが、正典の見出しは 14 種ある（担当 spec の記述が古い）。
"""

