areka-parsers の shell モジュールには記録の呼び出しが 1 つも無いので、落としたことはどこにも残らない。
areka はこの宣言を読まないので、どちらの書式を指定しても読み方は変わらない。旧い書式で書かれたシェルに合わせて読み方を切り替える道が無い。
同じ綴りの項目が surfacetable.txt・プラグインのイベント・SHIORI の資源にもあるが、いずれも別の項目である。
この食い違いを引き受ける行は沈黙ルール対応表にも見直し表にも無い（開発者裁定 2026-09-05 の 2 つ目の枝＝未対応）。
"""

