[entry."ukadoc:descript_shell:sakura.defaultx_2cX_5ea7_6a19:1"]
status = "absent"
introduced = ""
owner = "areka-P0-window-placement"
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。記録: なし。
areka は `defaultx` を `defaultleft` と区別しない。
areka は横に 1 つ・縦に 1 つの欄しか持たず、`defaultx` と `defaultleft` を同じ横の欄へ、`defaulty` と `defaulttop` を同じ縦の欄へ畳んで、先に書いてある方を採る（areka の placement::config::resolve_scope）。畳んだ後にどう解くかは机上の揃えだけで決まる——既定（下端）のときは横を連鎖の基準からの左方向のずらし量として使い、縦は丸ごと捨てる。`free` のときは横も縦も作業領域の左上を原点とする画面上の座標として使う（areka の placement::resolver）。つまり、どちらの綴りで書いたかは結果に効かない。
正典は `defaultx` を画像を基準にした X 座標（既定は画像の中央）と定め、`defaultleft` を画面上の X 座標と別々に定めている。areka はどちらの基準にも解かないので、書いた作者の意図した位置には立たない。
横の値の使い道そのものには裁定がある——沈黙ルール対応表の「複数スコープの既定 X 連鎖規則」が `defaultx` を名指しし、連鎖の基準からの左方向のずらし量（0＝基準に密着）として扱うことを意味論不変と決めている（担当は areka-P0-scope-chain-gap）。ただしその行が確かめたのはスコープどうしの相対位置であって、この欄 1 つの基準点ではない。本台帳が未対応として記録する食い違いは基準点の方であり、それを引き受ける行は沈黙ルール対応表にも見直し表にも無い（開発者裁定 2026-09-05 の 2 つ目の枝＝未対応）。
`sakura.` で始まるキーには、`kero.` や `charN.` のようなキャラクタの人数への効き目は無い（areka の placement::config::detect_scopes が材料にするのは `kero.` と `charN.` の綴りだけである）。
担当 spec は areka-P0-window-placement。同 spec の brief は既定の置き場所を建てる範囲として `defaultx`／`defaulty` の解決を design の対象に含めると書き、`defaultx` と `defaultleft` の関係を確かめて両表記を受ける寛容な実装にせよとも書いている（`defaulttop` は「揃えが `free` のときだけ有効」と正典から引いて読むべき欄に挙げている）。
"""

