[entry."ukadoc:descript_shell_surfaces:charset_2c_6587_5b57_30b3_30fc_30c9:1"]
status = "absent"
introduced = ""
owner = "areka-P0-charset-canon"
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。記録: なし。黙って落ちるのは charset の宣言そのものである。surfaces.txt を本番で読むのは areka の emo2_boot::assets（起動）と placement::measure（採寸）で、どちらも std の read_to_string で UTF-8 として読む（examples の下にも同じ読み方をする場所があるが、本番の経路ではない）。宣言された文字コードを見る手前を通らないので、この宣言はどこにも届かない。
ゴースト・シェル・バルーンの descript は areka-parsers の charset::prescan が冒頭の宣言を拾ってから読むのに対し、surfaces.txt だけがその経路の外にある。UTF-8 以外で書かれた surfaces.txt は読み取り自体が失敗し、シェルが出ない（Shift_JIS で書かれた既存シェルはこの読み取りで弾かれる）。黙って消えるのは宣言そのものだけで、続く読み取りの失敗のほうは記録される——areka の emo2_boot::BootWiringError::ShellRead が返り、areka の emo2_boot::classify_wiring_error が error として記録する。ただしそこで起動が止まるわけではない。areka の emo2_boot::wire_emo2_boot は記録したうえで結線しないまま戻り、areka の main は縮退した起動を続ける（窓を開くのは結線を試みるより前なので、窓は開いたままになる）。採寸側も同じで、areka の placement::measure は surfaces.txt の読取失敗を error として記録して採寸をあきらめ、areka の main は既定の DPI へ倒して先へ進む。作者に見えるのは「宣言が効かない」ではなく、記録に失敗を残したまま、シェルの出ない窓のまま起動が進む、である。採寸側の doc は、適合の対象としたゴーストの surfaces.txt が UTF-8 の宣言だから UTF-8 で読む、と決め打ちの理由を書いている。
同じ綴りの項目がゴースト・バルーン・シェル・プラグイン・ヘッドライン・インストール指示・surfacetable.txt にもあるが、いずれも別の項目である（読むファイルが違うので状態も割れる）。
この食い違いを引き受ける行は沈黙ルール対応表にも見直し表にも無い（開発者裁定 2026-09-05 の 2 つ目の枝＝未対応）。
担当 spec は areka-P0-charset-canon。同 spec の brief は範囲の In に surfaces.txt の読取 2 か所を挙げ、境界の候補の 1 つ目をその閉鎖としている。
"""

