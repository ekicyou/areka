status = "absent"
introduced = ""
owner = ""
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。記録: なし。areka-parsers の shell モジュールは surfaces.txt の中に書かれたバルーンのずらし量を、どの走査でも見ない。サーフェスごとにバルーンの出る位置をずらす仕掛けが丸ごと無い。
areka-parsers の shell モジュールには記録の呼び出しが 1 つも無いので、落としたことはどこにも残らない。
全体のずらし量を面ごとに変える道が無く、バルーンは面が替わっても同じ位置に出る。
接頭辞の無いこの綴りを見出しに持つのは surfaces.txt だけで、シェルの descript には無い（あちらは本体側・相方側の接頭辞が付いた形だけである）。
2 つの表を当たったが、この食い違いを引き受ける行はどちらにも無い——沈黙ルール対応表の「キーワード指定時に `windowposition.y` などの調整量をどう扱うか」と「バルーン位置オフセットの単位空間契約」は、どちらもずらし量をどの座標系・どの拡大率で持つかに答えているだけで、サーフェスごとの宣言が読まれないことには答えていない（開発者裁定 2026-09-05 の 2 つ目の枝＝未対応）。
"""

