note = """
壊れ方: 該当なし。areka はこのイベントを実際に SHIORI へ送っている。
ログ: 送出の直前に trace のログ（shiori_request）が 1 行出て、Method・ID・参照値・実行状態が
残る。送出そのものが失敗したときは error のログ（shiori_send_failed）が出て終了の系列へ倒れる
ので、黙って消えることはない。
根拠の場所: crates/areka-kanade/src/schedule/events.rs の ALLOWED_EVENT_IDS にこの名前が載って
おり、同じファイルの構築関数がこの呼び出しを組み立てる。送出は
crates/areka-kanade/src/actor.rs の round_trip_request。
構築関数: crates/areka-kanade/src/schedule/events.rs の baseware_version。
向き: ベースウェアから SHIORI へ知らせる側の通知（NOTIFY）である。ベースウェアが自分の版番号と
本体の識別を SHIORI へ伝えるだけで、SHIORI から値を引く項目ではない。
正典での所在: list_shiori_event ページの basewareversion（通知イベント）。カタログに同名の項目は
この 1 件しか無く、リソース側（list_shiori_resource）には存在しないため、この行はイベント側に
置き、リソース側には行を作らない。
テーマ: 付けない。ベースウェア自身の版と種別を知らせる値で、無いと利用者がゴーストの何を失うかを 1
文で言えないため付けない（迷ったら付けないという上流の補足に従う）。
"""

