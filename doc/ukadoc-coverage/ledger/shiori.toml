areka の内部名: areka が時報に使う内部の名前 OnHour は正典に対応する項目が無いので台帳の行を
作らず、扱いをここに書く。emo2 が OnSecondChange の内部で自発生成するため、ベースウェアの側からも
周期発火すると二重駆動になる。そのため OnHour は
crates/areka-kanade/src/schedule/events.rs の ALLOWED_EVENT_IDS に恒久的に含めない（同じ表の
説明にその旨が書いてある）。スケジューラ起源で OnHour を組み立てた呼び出しは送出されず、
error のログ event_id_not_allowed が残る。この恒久禁止は選択起源には及ばない。正典で時報に
当たるのがこの OnHourTimeSignal なので、最も近い正典項目としてここに置いた。
"""

[entry."ukadoc:list_shiori_event:OnInitialize:1"]
status = "implemented"
introduced = ""
owner = ""
priority = ""
values = []
links = []
note = """
壊れ方: 該当なし。areka はこのイベントを実際に SHIORI へ送っている。
ログ: 送出の直前に trace のログ（shiori_request）が 1 行出て、Method・ID・参照値・実行状態が
残る。送出そのものが失敗したときは error のログ（shiori_send_failed）が出て終了の系列へ倒れる
ので、黙って消えることはない。
根拠の場所: crates/areka-kanade/src/schedule/events.rs の ALLOWED_EVENT_IDS にこの名前が載って
