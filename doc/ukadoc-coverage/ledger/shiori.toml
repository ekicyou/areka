引く側の項目は値を引きに行かないので、ゴーストが用意した答えは使われない。どちらも例外にならず、
「その情報が無いまま進む」という形でだけ現れる。
ログ: 1 行も出ない。知らせる側は群 2 と同じで、この名前を組み立てる場所がコードのどこにも無く、
送出を止める判定に到達しない。群 2 が但し書きにしている選択起源の経路も、この群には及ばない——
受理規則が「On で始まること」であるのに対し、この群の名前はどれも On で始まらないためである
（schedule/choice.rs の plan_cascade は On で始まらない選択肢 ID を正典形の OnChoiceSelectEx へ
回すので、この群の名前が逐語のまま送出されることはない）。引く側も、引ける名前は username 1 つ
だけを載せた固定の表で決まっており、表に無い名前を引きに行く場所が無い。
向き: ベースウェアが SHIORI から引く側である。正典本文に [NOTIFY] の印は無く、拡張プロパティの
取得が起きたときにベースウェアがこの名前で問い、ゴーストが返した値をプロパティの値として使う。
扱いの違い: この行は同じ群の他の 23 件と性格が違う。他の 23 件はベースウェアが場面に応じて一方向に
知らせるか、ベースウェアが値を引くかのどちらかだが、この 2 件は外部からのプロパティの照会
（activeghostlist(ゴースト名／パス／ID).ext）を起点として、ベースウェアがゴーストへ取り次ぐ往復の
経路である。経路そのものの判断は areka-P0-property-query-channels が持つので、この行は owner に
その spec の名前を書くだけとし、判断を上書きしない。
テーマ: 付けない。要件 7.4 がテーマを付けない既定とする群である。外部からの拡張プロパティの照会を
ベースウェアがゴーストへ取り次ぐ往復の口であって、無いと利用者がゴーストの何を失うかに areka の側か
ら答えられないため。経路そのものの判断は areka-P0-property-query-channels が持つ。
"""

