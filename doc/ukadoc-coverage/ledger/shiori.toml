作らず、扱いをここに書く。areka でこの名前が現れるのは crates/areka-kanade/src/msg.rs の
単体テストだけで、「作者が \\q の選択肢 ID に書いた任意の名前が EventId::Choice に逐語のまま載って
SHIORI へ出る」ことを示す見本として使われている。恒久的に禁じている名前ではなく（恒久禁止は
OnTalk と OnHour の 2 つだけ）、On で始まるので選択起源の経路では実際に送出される。この扱いを
ここに置いたのは、選択肢の ID を Reference に運ぶ正典の項目のうち、この群に属する最も近いものが
OnChoiceEnter だからである（機構そのものを説明する OnChoiceSelect と OnChoiceSelectEx は
実装済みで別の群に属する）。
"""

