# ### 群 12 — 解釈している応答
#
# - **対象**: ステータスコード・`Value`・`ErrorLevel`・`ErrorDescription`。
# - **件数**: 4
# - **状態**: `implemented`
# - **テーマ**: 空（`[]`）
# - **優先度**: `""`
# - **判断の根拠の場所**: `crates/shiori-host32-host/src/shiori3.rs` の `parse_response` と
