[entry."ukadoc:list_shiori_event:OnAITalk:1"]
status = "absent"
introduced = ""
owner = ""
priority = ""
values = []
links = []
note = """
壊れ方: 黙って壊れる。ベースウェアが場面に応じてこのイベントを発火する経路が areka に無いので、
既存ゴーストの辞書に用意された返事はその場面で 1 度も呼ばれず、「何も喋らない」という形でだけ
現れる。
ログ: ベースウェアが場面に応じて発火する系統では 1 行も出ない。ALLOWED_EVENT_IDS にこの名前が
載っておらず、schedule/events.rs にこれを組み立てる構築関数も無いので、「送ろうとして断られる」
のではなく、そもそも組み立てる場所が無い。例外も出ない。ただしゴーストが \\q の選択肢 ID にこの
名前を書いた場合だけは別で、選択起源の経路（schedule/steady.rs の CascadePlan::Named の枝が
events.rs の on_choice_named を通す。受理規則 is_allowed_choice_event の条件は「On で始まること」
ただ 1 つ）で名前が逐語のまま送出され、そのときは trace のログ shiori_request がこの名前で
1 行出る。これはベースウェアが正典の発火条件で発火したものではないので、この行の状態は
absent のまま変わらない。
areka の内部名: areka が会話の自発発火に使う内部の名前 OnTalk は正典に対応する項目が無いので
台帳の行を作らず、扱いをここに書く。emo2 が OnSecondChange の内部で会話を自発生成するため、
ベースウェアの側からも周期発火すると二重駆動になる。そのため OnTalk は
crates/areka-kanade/src/schedule/events.rs の ALLOWED_EVENT_IDS に恒久的に含めない（同じ表の
説明にその旨が書いてある）。スケジューラ起源で OnTalk を組み立てた呼び出しは送出されず、
error のログ event_id_not_allowed が残る。この恒久禁止は選択起源には及ばない（受理規則
is_allowed_choice_event の条件は「On で始まること」ただ 1 つで、作者が選択肢に書いた
1 クリック 1 回の発火は二重駆動の根拠に当たらないため）。正典で自発の会話に当たるのがこの
OnAITalk なので、最も近い正典項目としてここに置いた。
"""

