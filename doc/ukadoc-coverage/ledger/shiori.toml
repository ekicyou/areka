内容: 入力箱を最初に出す画面上の座標。left が X、top が Y で、箱の種類は話しかけ箱・台本箱・
住所欄・教え込み箱・日付・時刻・IP・つまみ・合言葉・汎用の 10 通りある。
1 項目に 2 つの名前: 正典はこの 1 項目の見出しに .defaultleft と .defaulttop の 2 つの名前を
全角の空白で並べて載せている。担当 159 件のうち、1 つの見出しに 2 つの名前が入っているのは
この 1 件だけである。
語彙表との突き合わせ: crates/areka-sylphya/src/vocab/shiori_resource.rs の
SHIORI_RESOURCE_IDS はこの見出しを半角の空白で写している。担当 159 件のうち素の綴りで
食い違うのはこの 1 件だけで、空白の全角・半角の違いを同じものとみなすと 159 件すべてが
逐語で一致する。
既にあるカタログとの差: doc/shiori/fragments/resources/02.ghost_info.toml はこの項目を
boxname.defaultleft という名前に置き換えて 1 件だけ載せており、.defaulttop の側が落ちて
いる。断片の側の件数は 159 のままなので、件数を数えるだけでは気づけない。
"""

