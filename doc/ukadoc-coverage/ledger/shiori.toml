#   取得がいずれも `crates/` 以下に無いこと。HEADLINE と PLUGIN について areka にあるのは sylphya の
#   根の名前（`crates/areka-sylphya/src/vocab/dotted.rs`）とボタンの文言の語彙だけ。
# - **共通 `note`**:
#
#   ```
#   壊れ方: 黙って壊れる。ブラウザから渡される導入やイベントの依頼を受け取る口も、プラグインの決まりに
