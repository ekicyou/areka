読み取り失敗として扱い、そこで初めて明示的なエラーになる。
根拠の場所: crates/shiori-host32-host/src/shiori3.rs の build_request（Charset は 1 値のみを持つ
型から書き出し、SecurityLevel は local の文字列を直接書き出す）。
この行は固定値でしか送れない。Charset は UTF-8 の 1 値しか持たない型で、build_request は
その 1 値を書き出すだけなので、正典が許す他の文字コードを選ぶ枝が無い。任意の文字コードへ
広げる担当は owner の areka-P0-charset-canon。見出しが同じ項目がレスポンス側にもある
（Charset:2）。この行はリクエスト側だけを表し、両者を 1 つの行にまとめない。
"""

