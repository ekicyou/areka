210 Break・400 Bad Request・404 Not Found・408 Request Timeout・409 Conflict・
413 Payload Too Large・420 Refuse・500 Internal Server Error・501 Not Implemented・
503 Service Unavailable・505 Version Not Supported・512 Invisible が定義される。この 1 項目が
可変個のヘッダと状態コードの一覧をまとめて表す。
