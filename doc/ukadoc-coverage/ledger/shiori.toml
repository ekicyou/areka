OnBalloonTimeout ／ OnBalloonBreak の SHIORI 発火」。そこには M1 は発火させず、語彙・Reference の
割り当て・受け渡し口の型だけを残すと記録されている。解禁の条件は M2 で互換の範囲を広げるときで、
追跡先は areka-P0-balloon-canon-residue。
根拠の場所: crates/areka/src/emo2_boot/talk_lifecycle.rs の BalloonLifecycleNotice。
Reference 割当（転記元の記録の写し）: Ref0＝中断の操作が起きたスクリプト・Ref1＝中断が
起きたバルーンの scope 番号（本体側 0・相方側 1・以降も）・Ref2＝中断位置（スクリプト
先頭からの文字数・さくらスクリプトのタグを含む）。
テーマの直し: 索引の群 2a はこの群の既定を装いとしているが、装いの定義は「見た目を選び替えられること」
であり、話を中断された出来事はそれに当たらない。同じ群の OnBalloonTimeout に合わせて気配りに直した。
無いと失うもの: 話を途中で切られたことに気づけず、聞かれていない続きを同じ調子で話し続ける。
"""

