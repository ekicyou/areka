内容: SHIORI Event の考え方の手引きであり、ページ自身が正式な仕様書ではないと断っている。
ベースウェアが時間やマウスなどの変化をきっかけに知らせを出し、SHIORI がそれを受けて辞書から
さくらスクリプトを組んで返す、という往復の説明に始まり、Reference の通し番号（数が不定になる場合を
含む）、GET と NOTIFY という 2 つの発行の形（NOTIFY への返事はベースウェアが無視する・コマンドの
種類と ID の種類は独立している）までを扱う。
areka の内部名: この補足のページには対応する送出も照会も無いので、内部名の扱いはこの行には
置かない。OnTalk・OnHour・OnMenuBack の扱いは list_shiori_event の OnAITalk・OnHourTimeSignal・
OnChoiceEnter の各行に書いてあり、そこから動かさない。
"""

[entry."ukadoc:spec_dll"]
status = "degraded"
introduced = ""
owner = ""
priority = "E1"
values = []
links = []
note = """
壊れ方: できている範囲は明示的なエラーで守られており、できていない範囲は黙って壊れる。DLL の入口の
決まり（load・unload・request の 3 つ）のうち、SHIORI の DLL については areka の 32bit の助け手が
絶対パスで読み込み、3 つの入口をすべて名前で引いてから呼んでいる。同じ決まりを共有する SAORI・
MAKOTO・PLUGIN の DLL は、読み込む呼び出しそのものが無いので同居できない。
ログ: DLL が開けない・3 つの入口のいずれかが引けない・load が偽を返したときは、いずれも失敗として
呼び出し元へ返り、起動が黙って先へ進むことはない。一方 SAORI・MAKOTO・PLUGIN については、読み込もう
とする場所が無いのでログは 1 行も出ない。
SAORI: areka はプロトコルを実装せず、実装の主体は SHIORI 側である。成立の条件は 32bit の同じ
プロセスに同居すること・作業ディレクトリ・DLL の探索パスの 3 つ。ukadoc に SAORI の独立したページは
無いので、SAORI 用の行は作らない。MAKOTO は areka-P0-makoto-dll-host が担う。
縮退の転記元: doc/emo2-conformance-scope.md の旧ロードマップ spec への影響の表の行
「areka-P0-shiori-host-32 ＝ SAORI 同居を M1 から削除（emo2 未使用）。32bit SHIORI 往復に集中」。
粒度: このページ全体で 1 項目であり、他のページの 1 項目より粗い。
根拠の場所: crates/shiori-host32-helper/src/shiori_proxy.rs の ShioriByteProxy::load（絶対パスで
読み込み、3 つの入口を名前で引く）と ShioriByteProxy::request。
内容: SHIORI・SAORI ほかの伺かの DLL が共有する入口の決まり。受け渡しは Windows のグローバル
メモリ（GMEM_FIXED で確保・長さは len で受け取る・終端は保証されない）で行う。要求は request の
1 つの関数に集約され、その中身は HTTP や SSTP に倣った行とヘッダの形をとる。生存期間の関数は
loadu（SSP 2.6.92 以降・パスは UTF-8）・load（従来版・パスは既定のコードページ）・unload である。
areka の助け手が名前で引くのは load・unload・request の 3 つで、loadu は引かない。この 1 つの
項目が、その全体を抱える。
"""

