内容: SSTP/1.x の要求の側。外部のツールや他のゴーストがベースウェアへ送る書式で、1 行目に
メソッドとプロトコルの版、2 行目以降にヘッダが並ぶ。共通のヘッダは Charset・Sender・SecurityLevel・
SecurityOrigin（SSP 2.6.59 以降）・Option・ID・X-SSTP-PassThru-（任意の文字列）・HWnd・
ReceiverGhostHWnd（SSP 2.5.57 以降）・ReceiverGhostName（SSP 2.5.57 以降）である。この 1 項目が
可変個のヘッダをまとめて表す。
無いと失うもの: 外から届いた差し込みの中身を読み解けず、話しかけの内容が伝わらない。
"""

