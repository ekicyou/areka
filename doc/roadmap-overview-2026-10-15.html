<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
:root {
  --bg: #f6f6f4; --fg: #1d1d1b; --muted: #66665f; --panel: #ffffff; --line: #d8d8d2;
  --mark-bg: #ececea;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1b1a; --fg: #e8e8e4; --muted: #a2a29a; --panel: #262624; --line: #3c3c39; --mark-bg: #34342f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 16px; border-bottom: 1px solid var(--line); }
header h1 { margin: 0 0 4px; font-size: 20px; }
.source { color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.warnings { margin-top: 6px; color: #b3261e; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; }
.legend button { font: inherit; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--fg); cursor: pointer; }
.legend button[aria-pressed="true"] { outline: 2px solid var(--fg); }
.legend .clear { border-style: dashed; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.bands { display: flex; gap: 12px; padding: 0 16px 16px; overflow-x: auto; align-items: flex-start; }
.band { flex: 0 0 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.band h2 { margin: 0; font-size: 16px; }
.band .goal { color: var(--muted); margin: 2px 0; }
.band .count { font-weight: 600; margin-bottom: 6px; }
.group h3 { margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
.arrow { text-align: center; color: var(--muted); line-height: 1; margin: 2px 0; }
details.card { border: 1px solid var(--line); border-left: 6px solid var(--stripe); border-radius: 6px;
  margin: 4px 0; background: var(--panel); }
details.card > summary { cursor: pointer; padding: 6px 8px; list-style: none; }
details.card > summary::-webkit-details-marker { display: none; }
.name { font-weight: 600; word-break: break-all; }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; margin-left: 4px;
  background: var(--tag-bg); color: var(--tag-fg); }
.one { margin: 2px 0; }
.meta { color: var(--muted); font-size: 12px; }
.marks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.mark { font-size: 12px; padding: 0 6px; border-radius: 4px; background: var(--mark-bg); }
.mark.wave { background: #fde8b0; color: #4a3500; }
.mark.done { background: #cdeccf; color: #0f3d14; }
.mark.warn { background: #f8d0cc; color: #5c0f08; }
.prereqs { font-size: 12px; margin-top: 2px; }
.body { margin: 0; padding: 6px 8px 8px; border-top: 1px solid var(--line); font-size: 13px; }
.body dt { font-weight: 600; margin-top: 4px; }
.body dd { margin: 0 0 0 8px; white-space: pre-wrap; }
section.completed { padding: 0 16px 24px; }
section.completed h2 { font-size: 16px; }
.row { border: 1px solid var(--line); border-radius: 6px; margin: 4px 0; background: var(--panel); }
.row > summary { cursor: pointer; padding: 6px 8px; display: grid;
  grid-template-columns: 8em 7em minmax(0, 1fr) minmax(0, 2fr); gap: 8px; }
.row > summary span { overflow-wrap: anywhere; }
.row .body { white-space: pre-wrap; }
.head-row { display: grid; grid-template-columns: 8em 7em minmax(0, 1fr) minmax(0, 2fr); gap: 8px;
  padding: 0 9px; color: var(--muted); font-size: 12px; }
.extra { margin-top: 12px; }
@media (max-width: 640px) {
  .row > summary, .head-row { grid-template-columns: 1fr; gap: 0; }
  .head-row { display: none; }
}
</style>
</head>

と＝winget の上げ直し（winget upgrade）と外し方（winget uninstall）のどちらでも、利用者の物が 6 つ消える（後から入れたゴーストとバルーン・ゴーストの記憶。areka の記憶は残る）／外した後に PATH の項目が残る（記憶が入れ先に在るときは入れ先のフォルダも残る）／機械の全員向けでは areka の記憶が書けず、ゴーストを後から入れられない。同じブランチの /kiro-discovery の起票 2 本（user-data-root〔優先・区分 A〕・write-failure-notice〔バグ・区分 B〕）。今ある spec へ割り付けた件 2 つ（mcp-kanade-tools＝0.0.2 の MCP の sakurascript は仮の受け口／winget-release-automation＝PATH の残りを説明書の既知の制限の材料に・申し送りは同 spec の brief へ書いた）。決まり＝user-data-root が着地するまで、説明書に winget の行を載せず、winget-pkgs へ次の版を出さない。.kiro/ の外で足したのは dist/winget/0.0.2/ の 4 ファイルだけ（README.md・dist/README.txt・.github/workflows/ には触っていない）。記録は .kiro/specs/completed/areka-P0-winget-manifest-submission/verification/ の winget-local-check.md・submission.md。完了時の棚卸＝その場の解決 1 件（user-data-root の brief の議題に「次の版を、自分たち以外が winget-pkgs へ出しうること」を 1 行）・起票 0 件","oneLiner":"winget-manifest-submission: winget の名乗り Areka.Areka.Portable…"},{"wave":"C5（①）","date":"10-10","units":"anchor-tag-canon（10-10・文字とバルーン）","summary":"anchor-tag-canon: アンカー \\_a[ID]…\\_a の働きを作った（それまでは押しても何も起きなかった）。\\_a の 4 つの形を「開く・閉じる」の命令として読み、compile が AnchorBegin／AnchorEnd の cue を出す（崩れた 3 つの形は閉じを補い、形ごとに警告を 1 つ）。文字の層は範囲を記録し（種類＝アンカー・通し番号は選択肢と共有）、開いている間は既定の下線を焼く。当たりの判定は選択肢が先・アンカーが後。hit_active（押せる範囲が在るか）と choice_active（選択肢だけ）を分けた＝バルーンの時間切れの抑えは今も choice_active を読むので、アンカーは時間切れを遅らせない。kanade は定常の相でだけ受け、OnAnchorSelectEx を送り、204 のときだけ OnAnchorSelect を送る（On で始まる ID はそのイベントを直に送る）。台帳も期限も持たない。check_script に unpaired_tag を足した。網羅台帳＝SakuraScript の根 2 つと SHIORI のイベント 2 つを実装済みにし、アンカーの見た目の 59 行は anchor-style-canon へ移した。dola の CueCommand に 2 種類が増えた。互換の記録は doc/anchor-compat.md。実機の確かめ＝37 回押して誤り 0。完了時の棚卸＝その場の解決 3 件・起票 1 本（underline-bottom-row-clip〔バグ・区分 B〕）・今ある brief への申し送り 4 本（anchor-style-canon・coverage-roadmap-refresh・release-cycle・range-choice-tag）。この spec を前提にしていた後続＝range-choice-tag・link-context-copy・balloon-link-hover・anchor-style-canon（ほかの前提が残るものは台帳の「前提」の欄）","oneLiner":"anchor-tag-canon: アンカー \\_a[ID]…\\_a の働きを作った"},{"wave":"C5（②）","date":"10-10","units":"seriko-trigger-intervals（10-10・シェルの element）","summary":"seriko-trigger-intervals: interval の 3 語 talk,数値・runonce・periodic,数値 を動かした（それまでは名前を控えるだけで、口パクが動かなかった）。読み手（shell/{model,decode}.rs）は 3 語を型 Interval の 3 腕で返す（talk・periodic の数値が正の整数でなければ「それ以外の語」のまま）。seriko は 3 語を抽選せず乱数も引かない: 「始めるか・始めるなら何時に始まったことにするか」だけを trigger.rs の Armed が決め（runonce＝面が見え始めた時刻に 1 回・periodic＝見え始めからの周の境目そのもの・talk＝区切りの文字がバルーンに現れた時刻。どれも判定の時刻ではない）、始まった後は抽選の再生と同じ進み方をする。「再生中か」は開始の時刻で測る（長さが周期ちょうどの animation も毎周鳴る）。文字が現れる時刻は、文字の層と同じ式の写しを seriko の時計の上に持つ（talk.rs。どの表にも talk が無ければ cue を写さない）。部品にも同じ判定を使い、parts.rs の rebuild を 2 段にして、見えると決まった部品だけが引き金を受ける（1 段目の抽選の乱数の並びは変えていない）。バルーンの窓が閉じている間は鳴らさず、開いた時刻が periodic の新しい起点になる。無効な数値（talk,abc・periodic,0）と空のコマ列は warn! を残して採らない。兄弟の本番ファイルを 4 つ足した（trigger.rs・talk.rs・looper_trigger.rs・parts_trigger.rs）。網羅台帳＝assets.toml の 3 項目を実装済みにし、always の項目の持ち主を seriko-interval-combinations へ移した。+ の組み合わせ（bind+runonce ほか）は採っていない。検体は crates/areka-seriko/tests/fixtures/trigger-intervals/（面 9100〜9104・emo2 の surfaces.txt の末尾へ足して使う）。実機の確かめ（2026-10-10）＝runonce は面に入った 3 回に 1 回ずつ・periodic,2 は 20 件とも「面に入った時刻＋2,000 ms の倍数」ちょうど・一番上の talk,3 は 10 件、部品の talk,2 は 8 件（隣り合う開始の差と文字の層の式の差の食い違いは最大 9.0 ms）・同梱の emo2 そのままでは 3 語の記録 0 件。実機で踏めなかった場面（決定論のテストだけが固定）＝\\x（未対応）・3 語の面にいる間の着せ替えだけの変化・台詞の中断と新しい台詞・同じ時刻の区切りのまとめ（\\_q が未対応）。完了時の棚卸＝起票 5 本（seriko-trigger-teardown-gaps・seriko-talk-clock-fidelity・seriko-lottery-ended-play-skip・shiori-load-first-run-flake〔以上 4 本はバグ・区分 B〕・real-run-log-noise〔その他・区分 C〕）・今ある brief への申し送り 7 本（seriko-interval-combinations・seriko-script-triggers・seriko-rebuild-hidden-lottery・coverage-roadmap-refresh・mcp-kanade-tools・talk-fast-forward・sakura-time-directives）。この spec を前提にしていた後続＝seriko-script-triggers・seriko-interval-combinations・collisionex-regions・animated-image-import・balloon-canon-residue・seriko-rebuild-hidden-lottery（ほかの前提が残るものは台帳の「前提」の欄）","oneLiner":"seriko-trigger-intervals: interval の 3 語 talk,数値・runonce・per…"},{"wave":"C5 の外（単独・開発の道具）","date":"10-10","units":"impl-watch（10-10・新しいクレート）","summary":"impl-watch: 机の貸し出し（マージの机＝リポジトリごと・負荷テストの机＝マシンに 1 つ・停止要請と再開）を行うコンソールアプリ areka-impl-watch（crates/areka-impl-watch・bin・publish = false）を作った。各セッションが Bash から直に呼び、待ちは「番が来たら終わるコマンド」（終了コード 0 済み／1 失敗／2 使い方の誤り／3 当てはまらない・消えた）。判断の核 plan::apply（回収 → コマンド → 番の決め直し）は純粋で、口（置き場所 AREKA_IMPL_WATCH_HOME・居る印のロックファイル・state.json の排他と置き換え書き・status.md・impl-watch.log）は薄い。実装の後の裁定 9 件を反映（loadtest は申し込んだ者の状態を変えない・再開の待ちは stop requested again by \u003c識別\u003e でも終わる・置き場所は絶対パスだけ・探りは共有ロック・status.md が書けなくても結果は変えず警告 1 行・--id は小文字に寄る ほか）。手順書 doc/impl-watch.md・スキル /kiro-watch-clear。常時テスト 252 本・実機テスト（#[ignore]）11 本。スキル kiro-impl・kiro-complete はまだアプリを呼ばない（続きの impl-watch-skills）。完了時の棚卸の起票 2 本（impl-watch-skills・impl-watch-residue）","oneLiner":"impl-watch: 机の貸し出しを行うコンソールアプリ areka-impl-watchを作った"},{"wave":"C5（⑦）","date":"10-11","units":"mcp-stdio-bridge（10-11・新しいクレート）","summary":"mcp-stdio-bridge: Claude Desktop 用の中継 areka-mcp-bridge.exe（crates/areka-mcp-bridge・bin・publish = false・SSP の mcp.exe 相当）を作った。標準入力の 1 行 1 要求を、127.0.0.1 で待ち受ける areka の MCP の受け口（Streamable HTTP）へ中身のまま届け、答えを 1 行で返す（rmcp 3.5.0 のサーバー側とクライアント側をつなぐ・新しい外部のクレートは 0）。areka は候補 20 個（9801・9821・9802〜9810・9822〜9830）から名乗り areka-mcp-server で見つける（SSP の番号は飛ばす）。AREKA_MCP_PORT で 1 つに絞れ、0 は「探さずにエラーで答える」。areka が居ないときの最初の問い合わせと tools/list は、控え（前に areka から受け取った答えの写し）→ 中継が自分で持つ一覧（areka と同じ表から組む・5 つの版で本物の受け口と一致することをテストが固定）の順で答え、ツールの呼び出しだけ「areka が見つからない」のエラー。要求のたびに探し直すので、後から起こした areka へ Desktop を起動し直さずに届く。送る前の失敗は 1 回だけ探し直して送り直す（書いた後は送り直さない）。help の頁（/api/mcp/help）に Desktop の設定例・dist/README.txt に「■ Claude Desktop からつなぐ」・配布 zip に 4 本目の exe・SSP の mcp.exe との差の記録 doc/ssp-mcp/bridge-diff-areka.md。実機（Store 版の Claude Desktop）で 7 点を確かめた（Desktop は窓を閉じても終了しない・中継を 2 つ起こす・Store 版は控えを自分のパッケージのフォルダへ回す）。完了時の棚卸の起票 2 本（mcp-malformed-call-code・mcp-stdio-bridge-residue）","oneLiner":"mcp-stdio-bridge: Claude Desktop 用の中継 areka-mcp-bridge.exeを作…"},{"wave":"C6 の前（単独・配布と公開）","date":"10-11","units":"release-notes-highlights（10-11・リリース CI と道具）","summary":"release-notes-highlights: GitHub Release の本文を、GitHub に作らせた PR の題名の一覧から、その版の見どころ（数件・日本語・Claudia の口調）に替えた。見どころは doc/release-notes/v{版}.md に置き、版上げの PR で書く（書き方の決まりは doc/release-notes/README.md）。変更点の全部は「詳しいリリースノート」release-notes-v{版}.md として 5 つ目の添付にする（一つ前のタグからの本線の題名を種類で分け、開発の内部の作業は末尾にまとめる）。道具 tools/release-notes.ps1（-Check・-Notes・-Body・-SelfTest）を足し、全体テストに段 release notes check を足した。release.yml は見どころが欠けていれば組み立ての前に止まる（取り出しは fetch-depth: 0・添付は 5 つ・本文は --notes-file）。リリースの手順 release-cycle の要件・設計・タスクに、見どころを書く段と検査の段を足した。公開済みの v0.0.2 の頁を同じ形に直した（zip・ハッシュ・タグは同じ）。枝で乾いた走りを 1 回行って緑（走り 38124827102）。リリースの入口のスキル /release を足した（入口だけ・手順の正本は release-cycle の文書）。完了時の棚卸の起票は 0 本、release-cycle への申し送りが 1 件（手順をスキルへ移して同 spec を完了にする＝開発者の決定）。","oneLiner":"release-notes-highlights: GitHub Release の本文を、GitHub に作らせた P…"},{"wave":"C6 の前（単独・配布と公開）","date":"10-15","units":"release-cycle（リリースの手順）","summary":"release-cycle: 繰り返し spec として v0.0.2 を出したリリースの手順を、スキル /release（.claude/skills/release/ の SKILL.md・procedure.md）へ移して完了にした。外から見た動きは pasta と同じく承認なしで最後まで進み（マージとタグの push で止まらない）、見どころは最後の報告に全文を載せる（直しは公開の後に頼む）。roadmap の「リリース」の表への記録はやめ、次の版への申し送りは「次のリリースへの申し送り」の節に置く。deny.toml・about.toml から使っていない BSD-2-Clause を外した。レビュー役の指摘（再開の読み方の穴 2・一覧が main の変更を拾わない件ほか）を反映。完了の全体テストで、dola の任意の機能 yaml が引く unsafe-libyaml の勧告（RUSTSEC-2024-0449・保守されていない）が cargo deny check を赤にした＝deny.toml でこの 1 件だけを見逃し、dola-yaml-backend を起票（開発者の判断）。初めての実走は v0.0.3（user-data-root の着地の後）","oneLiner":"release-cycle: 繰り返し spec として v0.0.2 を出したリリースの手順を、スキル /releas…"}],"extra":[{"name":"package-check-temp-cleanup","oneLiner":"10-02 に release-package-versioned へ合流","theme":4}]},"warningCount":0}}</script>
<script>
(function () {
  "use strict";
  var all = JSON.parse(document.getElementById("roadmap-data").textContent);
  var L = all.labels, D = all.data;
  var noTheme = D.themes.length;

  // Labels hold {key} slots; values are inserted as plain text later.
  function fmt(s, vals) {
    return s.replace(/\{(\w+)\}/g, function (m, k) { return k in vals ? String(vals[k]) : m; });
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function hue(i) { return (i * 137.508) % 360; }
  function themeName(i) { return i === noTheme ? L.noTheme : D.themes[i]; }
  function paint(e, i) {
    if (i === noTheme) {
      e.style.setProperty("--stripe", "#9a9a94");
      e.style.setProperty("--tag-bg", "#e2e2de");
      e.style.setProperty("--tag-fg", "#33332f");
    } else {
      var h = hue(i).toFixed(1);
      e.style.setProperty("--stripe", "hsl(" + h + ", 60%, 45%)");
      e.style.setProperty("--tag-bg", "hsl(" + h + ", 70%, 88%)");
      e.style.setProperty("--tag-fg", "hsl(" + h + ", 70%, 22%)");
    }
  }
  function tag(i) { var t = el("span", "tag", themeName(i)); paint(t, i); return t; }
  function mark(cls, text) { return el("span", "mark " + cls, text); }

  // Header
  document.title = L.title;
  var header = el("header");
  header.appendChild(el("h1", null, L.title));
  var src = el("div", "source");
  src.appendChild(el("span", null, fmt(L.sourceUpdated, { date: D.source.updatedAt })));
  src.appendChild(el("span", null, D.source.blob === null ? L.sourceBlobUnknown : fmt(L.sourceBlob, { blob: D.source.blob })));
  header.appendChild(src);
  if (D.warningCount > 0) header.appendChild(el("div", "warnings", fmt(L.warningCount, { count: D.warningCount })));
  document.body.appendChild(header);

  // Legend
  var legend = el("div", "legend");
  document.body.appendChild(legend);
  var used = {};
  D.bands.forEach(function (b) { b.groups.forEach(function (g) { g.cards.forEach(function (c) { used[c.theme] = true; }); }); });
  var selected = {};
  var buttons = [];
  for (var i = 0; i <= noTheme; i++) {
    if (i === noTheme && !used[noTheme]) break;
    (function (ti) {
      var b = el("button");
      b.type = "button";
      b.setAttribute("aria-pressed", "false");
      var sw = el("span", "swatch"); paint(sw, ti); sw.style.background = "var(--stripe)";
      b.appendChild(sw);
      b.appendChild(el("span", null, themeName(ti)));
      b.addEventListener("click", function () {
        if (selected[ti]) delete selected[ti]; else selected[ti] = true;
        b.setAttribute("aria-pressed", selected[ti] ? "true" : "false");
        apply();
      });
      legend.appendChild(b);
      buttons.push(b);
    })(i);
  }
  var clear = el("button", "clear", L.clearFilter);
  clear.type = "button";
  clear.addEventListener("click", function () {
    selected = {};
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
    apply();
  });
  legend.appendChild(clear);

  function place(p) {
    var where = [];
    if (p.band !== null) where.push(p.band === "" ? L.notInBand : p.band);
    if (p.done) where.push(L.done);
    if (where.length === 0) where.push(L.notInRoadmap);
    return p.name + " (" + where.join(", ") + ")";
  }
  function dl(pairs) {
    var d = el("dl");
    pairs.forEach(function (p) {
      if (p[1] === null || p[1] === undefined || p[1] === "") return;
      d.appendChild(el("dt", null, p[0]));
      d.appendChild(el("dd", null, p[1]));
    });
    return d;
  }

  function card(c) {
    var d = el("details", "card");
    paint(d, c.theme);
    var s = el("summary");
    var top = el("div");
    top.appendChild(el("span", "name", c.name));
    top.appendChild(tag(c.theme));
    s.appendChild(top);
    s.appendChild(el("div", "one", c.oneLiner));
    var meta = [];
    if (c.tier !== null) meta.push(L.tier + ": " + c.tier);
    if (c.cls !== null) meta.push(L.cls + ": " + c.cls);
    if (c.size !== null) meta.push(L.size + ": " + c.size);
    if (meta.length) s.appendChild(el("div", "meta", meta.join(" / ")));
    var marks = el("div", "marks");
    if (c.wave !== null) marks.appendChild(mark("wave", L.wave + " " + c.wave));
    if (c.done) marks.appendChild(mark("done", L.done));
    if (c.notInLedger) marks.appendChild(mark("warn", L.notInLedger));
    if (c.otherBands.length) marks.appendChild(mark("warn", L.otherBands + ": " + c.otherBands.join(", ")));
    if (marks.childNodes.length) s.appendChild(marks);
    if (c.prereqs.length) s.appendChild(el("div", "prereqs", L.prereqs + ": " + c.prereqs.map(place).join(" / ")));
    d.appendChild(s);
    var body = dl([
      [L.what, c.ledger && c.ledger.what],
      [L.order, c.ledger && c.ledger.order],
      [L.prereqs, c.ledger && c.ledger.prereq],
      [L.note, c.note]
    ]);
    body.className = "body";
    if (body.childNodes.length) d.appendChild(body);
    return d;
  }

  // Bands
  var bandsEl = el("div", "bands");
  document.body.appendChild(bandsEl);
  var bandViews = [];
  D.bands.forEach(function (b) {
    var col = el("section", "band");
    col.appendChild(el("h2", null, b.notInBand ? L.notInBand : b.name));
    if (b.goal) col.appendChild(el("div", "goal", b.goal));
    var count = el("div", "count");
    col.appendChild(count);
    var view = { band: b, count: count, items: [], groups: [] };
    b.groups.forEach(function (g) {
      var ge = el("div", "group");
      if (g.heading !== null) ge.appendChild(el("h3", null, g.heading));
      var gv = { el: ge, items: [] };
      g.cards.forEach(function (c) {
        var wrap = el("div");
        if (c.chained) wrap.appendChild(el("div", "arrow", String.fromCharCode(0x2192)));
        wrap.appendChild(card(c));
        ge.appendChild(wrap);
        var it = { el: wrap, theme: c.theme };
        view.items.push(it);
        gv.items.push(it);
      });
      view.groups.push(gv);
      col.appendChild(ge);
    });
    bandViews.push(view);
    bandsEl.appendChild(col);
  });

  function baseCount(b) {
    if (b.declared !== null && b.declared === b.read) return fmt(L.bandCount, { count: b.read });
    if (b.declared === null && b.notInBand) return fmt(L.bandCount, { count: b.read });
    return fmt(L.bandCountMismatch, { declared: b.declared === null ? "?" : b.declared, read: b.read });
  }

  function apply() {
    var any = Object.keys(selected).length > 0;
    bandViews.forEach(function (v) {
      var n = 0;
      v.items.forEach(function (it) {
        var show = !any || !!selected[it.theme];
        it.el.hidden = !show;
        if (show) n++;
      });
      v.groups.forEach(function (g) {
        g.el.hidden = any && g.items.every(function (it) { return it.el.hidden; });
      });
      v.count.textContent = any ? fmt(L.bandCount, { count: n }) : baseCount(v.band);
    });
  }
  apply();

  // Completed area (never filtered)
  var done = el("section", "completed");
  done.appendChild(el("h2", null, L.completedHeading));
  var hr = el("div", "head-row");
  [L.colWave, L.colDate, L.colUnits, L.colSummary].forEach(function (t) { hr.appendChild(el("span", null, t)); });
  done.appendChild(hr);
  D.completed.rows.forEach(function (r) {
    var d = el("details", "row");
    var s = el("summary");
    [r.wave, r.date, r.units, r.oneLiner].forEach(function (t) { s.appendChild(el("span", null, t)); });
    d.appendChild(s);
    d.appendChild(el("div", "body", r.summary));
    done.appendChild(d);
  });
  if (D.completed.extra.length) {
    var ex = el("div", "extra");
    ex.appendChild(el("h3", null, L.completedExtra));
    D.completed.extra.forEach(function (x) {
      var d = el("div", "row");
      paint(d, x.theme);
      var line = el("div", "body");
      line.style.borderTop = "0";
      line.appendChild(el("span", "name", x.name));
      line.appendChild(tag(x.theme));
      line.appendChild(el("span", "mark done", L.done));
      line.appendChild(el("div", "one", x.oneLiner));
      d.appendChild(line);
      ex.appendChild(d);
    });
    done.appendChild(ex);
  }
  document.body.appendChild(done);
})();
</script>
