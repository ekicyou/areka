<svg viewBox="0 0 940 606" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif">
  <title>areka M1 全7トラック＋進捗（2026-07-02・M-boot 6/16）</title>
  <desc>7トラック構造と進捗。⓪ghost(owner) ①shiori(host-32) ②parsers ③kanade(conductor) ④sakura ⑤seriko(shell-anim) ⑥emo(render)。左がM-boot前提、右が増分(並走)。✅=完了(②parsers全完了・①pilot go/ipc完了)、★=次フロント(host32-shiori-load)。⑥emoが総合マウス制御を所有。owner-draw右クリックメニューはM2、M1メニューはballoon \q選択肢。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker>
  </defs>

