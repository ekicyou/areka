[package]
name = "dola"
workspace = "../.."
description = "Declarative Orchestration for Live Animation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true
keywords = ["animation", "declarative", "easing", "interpolation", "timeline"]
categories = ["graphics", "game-development"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = { workspace = true }
interpolation = "0.3.0"
rand = { workspace = true }

[dependencies.serde_yaml]
version = "0.9"
optional = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Performance"] }

[dev-dependencies]
serde_json = "1"

[features]
yaml = ["dep:serde_yaml"]
