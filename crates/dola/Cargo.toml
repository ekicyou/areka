[package]
name = "dola"
description = "Declarative Orchestration for Live Animation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true
keywords = ["animation", "declarative", "easing", "interpolation", "timeline"]
categories = ["graphics", "game-development"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = { workspace = true }
interpolation = "0.3.0"
rand = { workspace = true }
# pasta DSL integration (switch to versioned release when stable)
pasta_core = { git = "https://github.com/ekicyou/pasta.git", branch = "main" }

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.toml]
version = "0.8"
optional = true

[dependencies.serde_yaml]
version = "0.9"
optional = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Performance"] }

[features]
default = ["json"]
json = ["dep:serde_json"]
toml = ["dep:toml"]
yaml = ["dep:serde_yaml"]
