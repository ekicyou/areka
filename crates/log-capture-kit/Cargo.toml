[package]
name = "log-capture-kit"
workspace = "../.."
description = "ログ捕捉テストの硬化機構をワークスペースで唯一定義するテスト専用の leaf crate（spec: areka-P0-test-cage-determinism）: 常駐 probe・捕捉窓・正準イベント型・行整形・全スレッド捕捉"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# 硬化機構そのものの土台。Subscriber 実装・Dispatch（常駐 probe）・
# callsite::rebuild_interest_cache を引く唯一の必須依存。
# ワークスペース内 crate への依存は持たない（leaf・依存方向の規律）。
tracing = { workspace = true }
# `capture_under_filter`（RUST_LOG 相当 directive の実濾過）専用。feature `env-filter`
# を有効にしたときだけ引く任意依存で、既定 off。有効化するのは wintf のみ。
tracing-subscriber = { workspace = true, optional = true }

[features]
# EnvFilter 濾過つきの捕捉 API を有効にする。既定 off。
env-filter = ["dep:tracing-subscriber"]

[dev-dependencies]
# 検体パスの見張り（sample_path_guard_test）が走査語を作るのに登記表 SAMPLES を読む。
# 名前の一覧を見張り側へ手書きで写すと、検体を 1 つ足した瞬間に見張りが黙って穴を開ける。
# テスト専用の leaf 同士なので依存の向きは崩れない（本番側には出ない）。
sample-ghost-kit = { path = "../sample-ghost-kit" }
