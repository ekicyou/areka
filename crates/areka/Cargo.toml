[package]
name = "areka"
workspace = "../.."
description = "Desktop mascot platform for Windows"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false # crates.io の 0.0.1 は名前の確保だけ・利用者は配布の zip で入れる
keywords = ["ukagaka", "desktop-mascot", "windows", "character", "interactive"]
categories = ["gui", "games", "multimedia"]

[dependencies]
wintf = { path = "../wintf" }
# ゴーストの結線（置き場の根・一覧・GhostRuntime。起動・インストール・更新・メニュー・根の編集・MCP）。
areka-ghost = { path = "../areka-ghost" }
# 運行表 kanade への要求と答えの型（KanadeMsg・SSTP・オンラインの数え。起動・ドロップ・インストール・更新・メニュー・MCP）。
areka-kanade = { path = "../areka-kanade" }
# 設定・さくらスクリプト・文字コードの解析（インストールの規約・MCP の check_script／get_expression_table・書き出し・examples/emo-present.rs）。
areka-parsers = { path = "../areka-parsers" }
# プロパティの読み書き（MCP の GetProperty・名前の公開）と記憶の保存（起動・インストール・根の編集）。
areka-sylphya = { path = "../areka-sylphya" }
# `.nar` の読み取り・検査・展開（ドロップとメニューからのインストール）と CRC-32（png_image.rs）。
areka-nar = { path = "../areka-nar" }
# ネットワーク更新のエンジンと HTTP の取得（更新の手続き・インストールの URL 取得）。
areka-update = { path = "../areka-update" }
# MCP サーバの受け口（rmcp・tokio・hyper は areka-mcp 側に閉じる）。
areka-mcp = { path = "../areka-mcp" }
# 窓配置（窓の印・ゴーストの窓の表・バルーン位置の戻し。ドロップ・メニュー・MCP の check_script）。
areka-placement = { path = "../areka-placement" }
# 実行系（描画の結線・台帳・シェルとバルーンの解決・読み直しの引数。インストールの机・MCP・書き出し）。
areka-runtime = { path = "../areka-runtime" }
# マウス入力の結線（メニューの開き口）。
areka-input = { path = "../areka-input" }
# 切替・読み直し・起動・終わる相の層。
areka-session = { path = "../areka-session" }
# 異常終了の報告の表示（main.rs）。
human-panic = { workspace = true }
# インストールの URL 取得の失敗の型（install/fetch_url.rs）。
thiserror = { workspace = true }
tracing = { workspace = true }
# MCP の画像の写しで PNG の IDAT を圧縮する（png_image.rs）。
miniz_oxide = { workspace = true }
bevy_ecs = { workspace = true }
# ファイルを選ぶ画面（GetOpenFileNameW）の機能を本クレートで上乗せする。
windows = { workspace = true, features = ["Win32_UI_Controls_Dialogs"] }
# surface 画像の素材の表（書き出し・examples/emo-present.rs）。
areka-emo-atlas = { path = "../areka-emo-atlas" }
# surface の合成（MCP の dump_surface・書き出し・examples/emo-present.rs）。
areka-emo-compose = { path = "../areka-emo-compose" }
# SERIKO の表と束ね（MCP の check_script・書き出し）。
areka-seriko = { path = "../areka-seriko" }
# バルーンの文字層（MCP の check_script の書体の判定・dump_balloon の読み戻し）。
areka-emo-text = { path = "../areka-emo-text" }
# さくらスクリプトの検査・字の数え・スコープの鍵（インストールの規約・MCP の check_script／dump_balloon・書き出し）。
areka-sakura = { path = "../areka-sakura" }
# アクター通信の原語（MCP・メニュー・インストールと更新の机と作業スレッド・スレッドの役割）。
areka-actor = { path = "../areka-actor" }
# 合図の型（インストールと更新の告知）。
dola = { path = "../dola" }
# 描画コマンドの契約型と presenter（MCP の dump_surface・書き出し・examples/emo-present.rs）。
areka-emo-present = { path = "../areka-emo-present" }

[dev-dependencies]
# 試験用の `shiori_host`（`IShioriHost` 実装）とそのテストが使う。
shiori-abi = { path = "../shiori-abi" }
# 試験用の `shiori_host` の COM の実装だけが使う。
windows-core = { workspace = true }
# readonly 起動のテストが書ける根の判断を直接引く。
areka-user-data = { path = "../areka-user-data" }
# examples のログの初期化。
tracing-subscriber = { workspace = true }
# ShioriBackend の戻り値型（RequestError/ExitKind/ShutdownError/HelperStatus）を名前で参照する背骨の足場と、台本の SHIORI で起動を組むテスト。areka-kanade はこれらを re-export しない。
shiori-host32-host = { path = "../shiori-host32-host" }
# ログ捕捉テストの硬化機構。テスト専用・[dependencies] へは置かない。
log-capture-kit = { path = "../log-capture-kit" }
# テスト用一時パスをプロセス間で一意に組み立てる窓口。テスト専用・[dependencies] へは置かない。
temp-path-kit = { path = "../temp-path-kit" }
# 検体ゴースト／バルーンを名前で引く窓口。テスト・example 専用・[dependencies] へは置かない。
sample-ghost-kit = { path = "../sample-ghost-kit" }
# 実機の試験の窓口。検体の窓口を持つので [dependencies] へは置かない。
real-run-kit = { path = "../real-run-kit" }
# 入力・集めた層のテストの支えを本体のテストにだけ開ける（配置・実行系の支えは areka-session からだけ連鎖で開く）。
areka-input = { path = "../areka-input", features = ["test-support"] }
areka-session = { path = "../areka-session", features = ["test-support"] }
# オフラインの書き出しの検体の PNG を書き、書き出した PNG を RGBA で読む。
image = { version = "0.25.10", default-features = false, features = ["png"] }
