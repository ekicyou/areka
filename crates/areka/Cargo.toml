[package]
name = "areka"
workspace = "../.."
description = "Desktop mascot platform for Windows"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true
keywords = ["ukagaka", "desktop-mascot", "windows", "character", "interactive"]
categories = ["gui", "games", "multimedia"]

[[bin]]
name = "areka"
path = "src/main.rs"

[dependencies]
wintf = { version = "0.0.1", path = "../wintf" }
shiori-abi = { path = "../shiori-abi" }
areka-ghost = { path = "../areka-ghost" }
areka-kanade = { path = "../areka-kanade" }
areka-parsers = { path = "../areka-parsers" }
# ShioriHostSink 統合（areka-P0-sylphya task 9.1・R7.2/R7.3）で GetProperty/SetProperty を
# 統一プロパティシステム sylphya の reader/publisher へ委譲し第 2 ストア（HashMap）を撤去する
# ための workspace path 依存（bin → sylphya は許容・外部 crates.io 依存の追加ではない）。
areka-sylphya = { path = "../areka-sylphya" }
windows-core = { workspace = true }
human-panic = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-io = { version = "2.6", default-features = false }
bevy_ecs = { workspace = true }
windows = { workspace = true }
# placement の採寸（measure）で surface 原寸を合成取得するため通常依存へ昇格
# （areka-P0-window-placement design DD5・旧 dev-dependencies から移動）。
areka-emo-atlas = { path = "../areka-emo-atlas" }
areka-emo-compose = { path = "../areka-emo-compose" }
# emo2-boot 統合結線（areka-P0-emo2-boot・R10.8）で実 sink・presenter・文字層・契約型・
# clock を消費するための workspace path 依存昇格。外部（crates.io）依存の追加ではない統合結線
# （R10.5 の「新規依存」に該当しない）。
areka-seriko = { path = "../areka-seriko" }
areka-emo-text = { path = "../areka-emo-text" }
areka-sakura = { path = "../areka-sakura" }
areka-actor = { path = "../areka-actor" }
dola = { path = "../dola" }
# emo-present は placement 観測 example 用 dev-dependency だったが、emo2-boot の実 sink 結線
# （EmoPresenter・PresentCommand 契約正本）で通常依存へ昇格（areka-P0-emo2-boot design R10.8）。
# examples/emo-present.rs は通常依存からも参照可能。
areka-emo-present = { path = "../areka-emo-present" }

[dev-dependencies]
# 決定論 spine テスト（emo2_boot::spine・areka-P0-emo2-boot task 6.1）専用。scripted
# ShioriBackend が実装する ShioriBackend トレイトの戻り値型（RequestError/ExitKind/
# ShutdownError/HelperStatus）を名前で参照するために追加する。areka-kanade はこれら host32 型を
# re-export しないため直接 dev-dep とする（既に areka-ghost/areka-kanade 経由で推移ビルド済み・
# x64・新規外部（crates.io）依存ではない）。
shiori-host32-host = { path = "../shiori-host32-host" }
