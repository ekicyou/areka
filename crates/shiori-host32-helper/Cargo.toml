[package]
name = "shiori-host32-helper"
workspace = "../.."
description = "host-32 i686 helper binary (HelperMessageWindow / respond echo)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false # 配布の zip に入れる 32 ビットの補助 exe

[dependencies]
shiori-host32-ipc = { path = "../shiori-host32-ipc" }
wintf-winmsg-executor = { workspace = true }
thiserror = { workspace = true }

[dependencies.windows]
workspace = true
features = [
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Globalization",
    # DLL を読むときだけ OS の「正しくないイメージ」等の窓を止める（`shiori_proxy.rs` の `load_library_quiet`）
    "Win32_System_Diagnostics_Debug",
]
