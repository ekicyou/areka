[package]
name = "areka-seriko"
workspace = "../.."
description = "SERIKO アニメーションエンジン (⑤) — サーフェス解決・状態・発行・構築を担うアクター層"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# 単一の出力契約 `dola::cue::CueSink`（task 4.1）を実装するための workspace パス依存
# （task 6.1 が emo-text へ追加したのと同型・循環なし: dola は seriko に依存しない）。
# `TalkCue`/`CueCommand`/`CueTarget`/`cue_target_of` は元々 dola 型で、areka-sakura は re-export。
# ghost live-path も `CueSink` 注入で結線する（task 8.1 で旧 `SurfaceSink` 経路を撤去し一本化）。
dola = { path = "../dola" }
areka-sakura = { path = "../areka-sakura" }
areka-emo-compose = { path = "../areka-emo-compose" }
areka-parsers = { path = "../areka-parsers" }
areka-actor = { path = "../areka-actor" }
tracing = { workspace = true }

[dev-dependencies]
# タスク 3.1 の sink send 失敗（inbox 受信端消失）時の error! 発火を捕捉する専用。
# workspace で既出（areka／wintf／emo-compose／kanade が dev で使用済み）・テスト限定であり、
# 出荷クロージャに新規外部依存を持ち込まない（要件 6.3 のログ檻を決定論化する土台）。
tracing-subscriber = { workspace = true }
# ログ捕捉テストの硬化機構の唯一の定義元（spec: areka-P0-test-cage-determinism）。
# ワークスペース内 crate に依存しない leaf・publish = false・テスト専用であり、
# 出荷クロージャに新規外部依存を持ち込まない（必須依存は tracing のみ＝既出）。
# 依存方向の規律により [dependencies] へは決して置かない。
log-capture-kit = { path = "../log-capture-kit" }
