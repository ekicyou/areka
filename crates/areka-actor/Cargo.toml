[package]
name = "areka-actor"
workspace = "../.."
description = "Engine-independent actor conventions and thin helpers for areka (spawn/reply pure layer + UI bridge); minimal-dependency, no subscriber init"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false # areka 本体の部品・areka の中でしか意味を持たない
repository.workspace = true

[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
async-channel = { workspace = true }
wintf-winmsg-executor = { workspace = true }

[dev-dependencies]
windows = { workspace = true }
# ログ捕捉テストの硬化機構の唯一の定義元（spec: areka-P0-test-cage-determinism）。
# ワークスペース内 crate に依存しない leaf・publish = false・テスト専用であり、
# 出荷クロージャに新規外部依存を持ち込まない（必須依存は tracing のみ＝既出）。
# 依存方向の規律により [dependencies] へは決して置かない（spec: actor-thread-log-capture）。
log-capture-kit = { path = "../log-capture-kit" }
