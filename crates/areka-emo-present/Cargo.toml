[package]
name = "areka-emo-present"
workspace = "../.."
description = "emo render engine 提示段（三段直列チェーン 3/3）: ComposedSurface を WUC 表示面へアップロード・提示し、指令 API（PresentCommand）契約正本を定義する最終段"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
areka-parsers = { path = "../areka-parsers" }
areka-emo-atlas = { path = "../areka-emo-atlas" }
areka-emo-compose = { path = "../areka-emo-compose" }
areka-actor = { path = "../areka-actor" }
wintf = { version = "0.0.1", path = "../wintf" }
bevy_ecs = { workspace = true }
# chain.rs（SwapChainPresenter・製品コード）は D3D11/DXGI 直呼び（UpdateSubresource/CopyResource/
# Map/Present/ResizeBuffers・IDXGISwapChain1 等）を要する。workspace 既定へ `Win32_Graphics_Dxgi`
# を上乗せする（`Win32_Graphics_Dxgi_Common` は workspace 側で有効・swap chain 本体型はこちら）。
windows = { workspace = true, features = ["Win32_Graphics_Dxgi"] }
# mount.rs（VisualMount）は SpriteVisual::SetSize に Vector2（windows-numerics）を要する。
# wintf と同一の workspace ピン（0.3.1）を用いる。
windows-numerics = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Task 1.3 spike 統合テスト（tests/swapchain_spike.rs）用。wintf の windows feature 集合を継承し
# （workspace.dependencies.windows）、D3D11/DXGI/WUC の直呼び API（UpdateSubresource/CopyResource/
# Map/Present/ResizeBuffers・IDXGISwapChain1 等）を明示的に有効化する。
windows = { workspace = true, features = ["Win32_Graphics_Dxgi"] }
