[package]
name = "areka-ghost"
workspace = "../.."
description = "areka ⓪ghost 結線層: descript.txt 起点のマウント解決から shiori 通信層・kanade・sakura・ticker を起動〜終了統括まで結線する"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
areka-talk = { path = "../areka-talk" }
areka-actor = { path = "../areka-actor" }
areka-kanade = { path = "../areka-kanade" }
areka-sakura = { path = "../areka-sakura" }
areka-parsers = { path = "../areka-parsers" }
shiori-host32-host = { path = "../shiori-host32-host" }
shiori-host32-ipc = { path = "../shiori-host32-ipc" }
windows = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# task 2.4（ghost::sink の LogSink）のログ発火検証専用。workspace で既出（kanade が
# schedule::log_capture で同じ技法を使用済み）・テスト限定であり、設計「新規外部
# 依存なし」（＝runtime 依存の制約）には抵触しない。
tracing-subscriber = { workspace = true }
# LogSink の command_kind テストで CueCommand::Custom { params: DynamicValue } を
# 組み立てるためだけの workspace path dep（本体 import は areka_sakura::contract
# 経由・dola への直接依存は本体コードに持ち込まない）。
dola = { path = "../dola" }
