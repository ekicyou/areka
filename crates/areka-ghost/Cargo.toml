[package]
name = "areka-ghost"
workspace = "../.."
description = "areka ⓪ghost 結線層: descript.txt 起点のマウント解決から shiori 通信層・kanade・sakura・ticker を起動〜終了統括まで結線する"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
areka-talk = { path = "../areka-talk" }
areka-actor = { path = "../areka-actor" }
areka-kanade = { path = "../areka-kanade" }
areka-sakura = { path = "../areka-sakura" }
# task 8.2（sylphya 結線）: 統一プロパティシステム（掲示板モデル）の spawn／publish／reader を
# ghost boot が起動・結線する。ghost は sylphya の上位層であり許容される path dep（新規外部依存なし）。
areka-sylphya = { path = "../areka-sylphya" }
areka-parsers = { path = "../areka-parsers" }
shiori-host32-host = { path = "../shiori-host32-host" }
shiori-host32-ipc = { path = "../shiori-host32-ipc" }
# task 2.1（InProcLibrary）: shiori_factory 解決結果を IShioriFactory へ move-out するための
# COM ABI 面（IShioriFactory）。workspace path crate であり「新規外部依存なし」に抵触しない。
shiori-abi = { path = "../shiori-abi" }
windows = { workspace = true }
# task 2.2（InProcHost）: `#[implement(IShioriHost)]` の生成コードが `::windows_core` を絶対パス参照
# するため、`windows` の再エクスポート（型のみ利用の task 2.1 では十分だった）に加え windows-core を
# 直接依存として要する。既存の workspace 依存であり新規外部依存ではない（areka bin の ShioriHostSink
# も同 `#[implement(IShioriHost)]` で同 dep を用いる）。
windows-core = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# LogSink の command_kind テストで CueCommand::Custom { params: DynamicValue } を
# 組み立てるためだけの workspace path dep（本体 import は areka_sakura::contract
# 経由・dola への直接依存は本体コードに持ち込まない）。
dola = { path = "../dola" }
# task 2.1（InProcLibrary happy-path 単体テスト）: 契約定数 DLL_FILE_NAME を参照し、
# かつ `cargo test --workspace` が cdylib を deps へ uplift する build-order edge を張るための
# workspace path dep（本体コードには持ち込まない・テスト限定）。
shiori4-testdll = { path = "../shiori4-testdll" }
# ログ捕捉テストの硬化機構の唯一の定義元（spec: areka-P0-test-cage-determinism）。
# ワークスペース内 crate に依存しない leaf・publish = false・テスト専用であり、
# 出荷クロージャに新規外部依存を持ち込まない（必須依存は tracing のみ＝既出）。
# 依存方向の規律により [dependencies] へは決して置かない。
log-capture-kit = { path = "../log-capture-kit" }
# テスト用一時パスをプロセス間で一意に組み立てる窓口の唯一の定義元（同 spec）。
# 依存 0（std のみ）の leaf・publish = false・テスト専用。log-capture-kit と同じく
# [dependencies] へは決して置かない。
temp-path-kit = { path = "../temp-path-kit" }
