[package]
name = "ukadoc-survey"
workspace = "../.."
description = "ukadoc（SSP 公式仕様書）の正典カタログと areka の判定台帳を建てる調査道具（spec: areka-P0-ukadoc-survey-toolkit）。areka の実行時コードからは参照されない leaf crate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ukadoc-survey"
path = "src/main.rs"

[dependencies]
# カタログ・台帳の「読み取り」だけに使う。書き出しは src/tomlout.rs の自前組み立てに
# 閉じる（設計 D-9・付録 A が凍結した書き方と toml の書き出しが一致しないため）。
toml = { workspace = true }
# SurveyError の定義。全クレート共通の規約（tech.md:56）。
thiserror = { workspace = true }
# スナップショット JSON の読み取りだけに使う。ルートの Cargo.toml を触らないため
# 版はクレート側に書く（設計 D-2・前例 crates/dola/Cargo.toml:21-23）。
# serde の派生機能は使わないので serde は直接依存に加えない。
serde_json = "1"
