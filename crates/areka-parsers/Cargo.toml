[package]
name = "areka-parsers"
workspace = "../.."
description = "Pure, minimal-dependency parser family for areka (sakura script and siblings); host-independent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
encoding_rs = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# テスト用一時パスをプロセス間で一意に組み立てる窓口の唯一の定義元（test-cage-determinism）。
# 依存 0（std のみ）の leaf・publish = false・テスト専用。本 crate は host-independent な
# 純パーサ群なので、[dependencies] へは決して置かない。
temp-path-kit = { path = "../temp-path-kit" }
# 検体ゴースト／バルーンを名前で引く唯一の窓口（spec: areka-P0-nar-install 要件 1）。
# テスト・example が検体の在処を自前で綴らないための leaf・テスト専用であり、
# 依存方向の規律により [dependencies] へは決して置かない。
sample-ghost-kit = { path = "../sample-ghost-kit" }
