[package]
name = "areka-placement"
workspace = "../.."
description = "areka window placement: resolves and follows character/balloon window positions from ghost definitions"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false # areka 本体の部品・areka の中でしか意味を持たない
repository.workspace = true

[features]
# 本体のテストだけが使う支えを開ける・本体は dev-dependency でだけ付ける（spec: placement-crate-split 要件 3.3／3.5）。
test-support = []

[dependencies]
wintf = { path = "../wintf" }
areka-parsers = { path = "../areka-parsers" }
areka-emo-atlas = { path = "../areka-emo-atlas" }
areka-emo-compose = { path = "../areka-emo-compose" }
areka-emo-present = { path = "../areka-emo-present" }
areka-sylphya = { path = "../areka-sylphya" }
areka-ghost = { path = "../areka-ghost" }
bevy_ecs = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
# ログ捕捉テストの硬化機構の唯一の定義元（spec: areka-P0-test-cage-determinism）。
# ワークスペース内 crate に依存しない leaf・publish = false・テスト専用であり、
# 出荷クロージャに新規外部依存を持ち込まない（必須依存は tracing のみ＝既出）。
# 依存方向の規律により [dependencies] へは決して置かない。
log-capture-kit = { path = "../log-capture-kit" }
# 検体ゴースト／バルーンを名前で引く唯一の窓口（spec: areka-P0-nar-install 要件 1）。
# テスト・example が検体の在処を自前で綴らないための leaf・テスト専用であり、
# log-capture-kit と同じく [dependencies] へは決して置かない。
sample-ghost-kit = { path = "../sample-ghost-kit" }
# テスト用一時パスをプロセス間で一意に組み立てる窓口の唯一の定義元（同 spec）。
# 依存 0（std のみ）の leaf・publish = false・テスト専用。log-capture-kit と同じく
# [dependencies] へは決して置かない。
temp-path-kit = { path = "../temp-path-kit" }
# 実濾過（EnvFilter）の観測と捕捉の窓を差すテストが使う（本体の表と同じ版・ワークスペースの表から受ける）。
tracing-subscriber = { workspace = true }
# examples/window-placement.rs の smoke 自動 close の計時（本体・wintf と同じ版・Cargo.lock に新しいクレートは増えない）。
async-io = { version = "2.6", default-features = false }
