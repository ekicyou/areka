[package]
name = "areka-emo-compose"
workspace = "../.."
description = "emo render engine 合成コア（三段直列チェーン 2/3）: fold→plan→execute で Shell 転記モデルと AtlasTable から ComposedSurface を生成する純粋層"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
areka-parsers = { path = "../areka-parsers" }
areka-emo-atlas = { path = "../areka-emo-atlas" }
bevy_ecs = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# テスト専用のログ捕捉ハーネス（log_capture）用。ワークスペース既存基盤（crates/areka・
# crates/wintf も dev で使用）ゆえ、出荷クロージャに新規外部依存を持ち込まない（要件 12.2）。
tracing-subscriber = { workspace = true }
