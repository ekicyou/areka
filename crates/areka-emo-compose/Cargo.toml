[package]
name = "areka-emo-compose"
workspace = "../.."
description = "emo render engine 合成コア（三段直列チェーン 2/3）: fold→plan→execute で Shell 転記モデルと AtlasTable から ComposedSurface を生成する純粋層"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
areka-parsers = { path = "../areka-parsers" }
areka-emo-atlas = { path = "../areka-emo-atlas" }
bevy_ecs = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# ログ捕捉テストの硬化機構の唯一の定義元（spec: areka-P0-test-cage-determinism）。
# ワークスペース内 crate に依存しない leaf・publish = false・テスト専用であり、
# 出荷クロージャに新規外部依存を持ち込まない（必須依存は tracing のみ＝既出）。
# 依存方向の規律により [dependencies] へは決して置かない。
log-capture-kit = { path = "../log-capture-kit" }
