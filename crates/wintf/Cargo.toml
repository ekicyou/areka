[package]
name = "wintf"
workspace = "../.."
description = "Windows Tategaki Framework - Rust UI library with Japanese vertical text support"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true
keywords = ["windows", "ui", "directcomposition", "japanese", "vertical-text"]
categories = ["gui", "graphics", "rendering", "os::windows-apis"]

[features]
serde = ["dep:serde"]

[dependencies]
ambassador ={ workspace = true }
async-executor = { workspace = true }
async-task = { workspace = true }
event-listener = { workspace = true }
wintf-winmsg-executor = { workspace = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_tasks = { workspace = true }
bevy_utils = { workspace = true }
dola = { path = "../dola" }
nonmax = { workspace = true }
serde = { version = "1", optional = true, features = ["derive"] }
taffy = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
windows = { workspace = true }
windows-core = { workspace = true }
windows-numerics = { workspace = true }

[dev-dependencies]
human-panic = { workspace = true }
rand ={ workspace = true }
async-io = { version = "2.6", default-features = false }
tracing-subscriber = { workspace = true }
image = "0.25.9"
