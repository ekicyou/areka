[package]
name = "shiori-host32-testdll"
description = "host-32 minimal SHIORI DLL fixture (flat-C load/unload/request) for deterministic LOAD E2E"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false # 試験用の DLL
repository.workspace = true

[lib]
name = "shiori"                 # 出力を shiori.dll にする
crate-type = ["cdylib"]

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    # OnTestReenter が helper の窓へ空の WM_COPYDATA を送る
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
]
