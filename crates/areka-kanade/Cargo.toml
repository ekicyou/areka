[package]
name = "areka-kanade"
workspace = "../.."
description = "kanade (conductor) engine for areka: canonical 運行表 (scheduling state machine) and talk startup contract; pure state machine + actor shell + swappable message boundary"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false # areka 本体の部品・areka の中でしか意味を持たない
repository.workspace = true

[dependencies]
areka-actor = { path = "../areka-actor" }
areka-talk = { path = "../areka-talk" }
dola = { path = "../dola" }
shiori-host32-host = { path = "../shiori-host32-host" }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# テストの時刻の組み立て（`dola::time::testing` の `at_ms`・`ms`・`delta_ms`）を使う。
dola = { path = "../dola", features = ["test-support"] }
# shiori/real.rs のテストと結合テスト 2 本（idle_pump_test・real_helper_test）が IPC の型を
# 組み立てるための workspace path dep（本体 import は shiori-host32-host 経由・host32 境界は real.rs に閉じる）。
shiori-host32-ipc = { path = "../shiori-host32-ipc" }
# ログ捕捉テストの硬化機構の唯一の定義元（spec: areka-P0-test-cage-determinism）。
# ワークスペース内 crate に依存しない leaf・publish = false・テスト専用であり、
# 出荷クロージャに新規外部依存を持ち込まない（必須依存は tracing のみ＝既出）。
# 依存方向の規律により [dependencies] へは決して置かない。
log-capture-kit = { path = "../log-capture-kit" }
