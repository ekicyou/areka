# 先進坑 pilot-windows-rs-next: 本線から独立したワークスペース（二坑モデルの例外・要件 1.2）。
# [package] を持たない仮想の manifest。1.2 で各クレートを members に足す。
[workspace]
resolver = "3"
members = []

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# 上流 windows-rs master を 1 つの rev に固定（動かすのは要件 2.5 の手順の後だけ）。[patch] は置かない。
windows-core = { git = "https://github.com/microsoft/windows-rs", rev = "f37e2f9046cf9710fe00285436c4d22ad6053d72" }
windows-result = { git = "https://github.com/microsoft/windows-rs", rev = "f37e2f9046cf9710fe00285436c4d22ad6053d72" }
windows-strings = { git = "https://github.com/microsoft/windows-rs", rev = "f37e2f9046cf9710fe00285436c4d22ad6053d72" }
windows-link = { git = "https://github.com/microsoft/windows-rs", rev = "f37e2f9046cf9710fe00285436c4d22ad6053d72" }
windows-numerics = { git = "https://github.com/microsoft/windows-rs", rev = "f37e2f9046cf9710fe00285436c4d22ad6053d72" }
windows-text = { git = "https://github.com/microsoft/windows-rs", rev = "f37e2f9046cf9710fe00285436c4d22ad6053d72" }
windows-bindgen = { git = "https://github.com/microsoft/windows-rs", rev = "f37e2f9046cf9710fe00285436c4d22ad6053d72" }
# 名指しされたときだけ使う兄弟
windows-future = { git = "https://github.com/microsoft/windows-rs", rev = "f37e2f9046cf9710fe00285436c4d22ad6053d72" }
windows-collections = { git = "https://github.com/microsoft/windows-rs", rev = "f37e2f9046cf9710fe00285436c4d22ad6053d72" }
windows-reference = { git = "https://github.com/microsoft/windows-rs", rev = "f37e2f9046cf9710fe00285436c4d22ad6053d72" }
windows-time = { git = "https://github.com/microsoft/windows-rs", rev = "f37e2f9046cf9710fe00285436c4d22ad6053d72" }

# 借りる本線のクレート（置き場の根からの相対 path）
wintf = { path = "../../../wintf" }
areka-emo-text = { path = "../../../areka-emo-text" }
areka-parsers = { path = "../../../areka-parsers" }
areka-sakura = { path = "../../../areka-sakura" }

# crates.io（本線の Cargo.lock と同じ版）
bevy_ecs = "0.19.1"
png = "0.18.1"
tracing = "0.1"
tracing-subscriber = "0.3"
scip = "0.10"
