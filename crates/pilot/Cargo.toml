[package]
name = "pilot"
workspace = "../.."
description = "Pilot (先進坑) quarantine crate: throwaway exploration code + 一次記録. publish=false, leaf node. 探索コードは examples/ のみ・lib は空（命綱の構造的担保）."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false # 試し掘りの場
repository.workspace = true

# 依存は先進坑が要る最小限だけ。葉ノード隔離（ほかの crate は pilot に頼らない）と
# i686 helper の組み立てを崩さないこと。
[dependencies]
# 先進坑 wintf-winmsg-executor・pilot-clickthrough-alpha-toggle・shiori-host-32 の窓とループ。
# リポジトリ内の写し（crates/wintf-winmsg-executor）をワークスペースの依存で使う。
# クラス登録の CS_DBLCLKS と既定カーソルは写しに入っている。
wintf-winmsg-executor = { workspace = true }
# pilot-clickthrough-alpha-toggle の状態変化の起床（state_changed）。
event-listener = { workspace = true }
# ワークスペース既定への追加 features:
# - Win32_System_DataExchange: shiori-host-32 の ipc.rs の COPYDATASTRUCT（WM_COPYDATA）。
# - Win32_System_Memory: shiori-host-32 の shiori_proxy.rs の GlobalAlloc/GlobalFree
#   （pasta の HGLOBAL 規約・GMEM_FIXED）。
# - Win32_Globalization: 同 shiori_proxy.rs の WideCharToMultiByte(CP_ACP)＝ghostdir の
#   ANSI(Shift_JIS) 変換。
# - Win32_Graphics_Dxgi: pilot-balloon-asset-swap の画面取り込み（Desktop Duplication）。
# LoadLibraryW/GetProcAddress/FreeLibrary と HGLOBAL/HMODULE はワークスペース既定にある。
windows = { workspace = true, features = [
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Globalization",
    "Win32_Graphics_Dxgi",
] }
windows-core = { workspace = true }

# テストを持つ実行例は test = true にして全体テスト（cargo test --workspace）で走らせる。
# path を書かないものは cargo の推し量り（examples/<name>/main.rs）に任せる。
# _template と wintf-winmsg-executor はテストを持たないので書かない。
[[example]]
name = "pilot-balloon-asset-swap"
test = true

[[example]]
name = "pilot-clickthrough-alpha-toggle"
test = true

[[example]]
name = "pilot-dropfiles-on-wuc-window"
test = true

[[example]]
name = "shiori-host-32"
test = true

# i686 で組む helper（独立のバイナリ）。サブフォルダの helper.rs は推し量られないので path を書く。
[[example]]
name = "shiori-host-32-helper"
path = "examples/shiori-host-32/helper.rs"
test = true

[dev-dependencies]
# 検体ゴースト／バルーンを名前で引く唯一の窓口（spec: areka-P0-nar-install 要件 1）。
# example が検体の在処を自前で綴らないための leaf・純 Rust（i686 helper でも組める）であり、
# 依存方向の規律により [dependencies] へは決して置かない。
sample-ghost-kit = { path = "../sample-ghost-kit" }

# 先進坑 pilot-balloon-asset-swap 用（使い捨て前提）: バルーン窓（wintf）・提示（present）・
# 合成（compose）・復号（atlas）・ECS・ログ。依存は pilot → 既存 crate の一方向のみ。
# wintf は i686 で組めない（SetWindowLongPtrW の型が 32bit で異なる）ため x86 を除外し、
# i686 helper（shiori-host-32-helper）のビルドに dev-dependencies が波及しないようにする。
[target.'cfg(not(target_arch = "x86"))'.dev-dependencies]
wintf = { path = "../wintf" }
areka-emo-present = { path = "../areka-emo-present" }
areka-emo-compose = { path = "../areka-emo-compose" }
areka-emo-atlas = { path = "../areka-emo-atlas" }
bevy_ecs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
