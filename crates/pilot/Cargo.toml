[package]
name = "pilot"
workspace = "../.."
description = "Pilot (先進坑) quarantine crate: throwaway exploration code + 一次記録. publish=false, leaf node. 探索コードは examples/ のみ・lib は空（命綱の構造的担保）."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# [dependencies] は空（最小依存）。先進坑が依存を要する場合のみ最小限追加し、
# 葉ノード隔離（inbound ゼロ）と 32bit 可搬性を崩さないこと。
#
# 先進坑 wintf-winmsg-executor 用の探索依存（使い捨て前提）。
[dependencies]
# 0.0.5: クラス登録に CS_DBLCLKS ＋ 既定カーソルを内蔵（フォーク上流で修正）。
# 本坑 wintf 置換ではこの版を pin し、wintf 側の DblClkClassFixup を撤去する。
wintf-winmsg-executor = "0.0.5"
event-listener = "5"
# host-32 先進坑の追加 features（いずれもワークスペース既定への加算・最小）:
# - Win32_System_DataExchange: IpcChannel（ipc.rs）の COPYDATASTRUCT（WM_COPYDATA ペイロード）。
# - Win32_System_Memory: ShioriByteProxy（shiori_proxy.rs・task 3.1）の GlobalAlloc/GlobalFree
#   （pasta の HGLOBAL 規約・GMEM_FIXED）。
# - Win32_Globalization: 同 proxy の WideCharToMultiByte(CP_ACP)＝ghostdir を ANSI(Shift_JIS)
#   エンコード（pasta to_ansi_str との charset 対称・design §493）。
# LoadLibraryW/GetProcAddress/FreeLibrary（Win32_System_LibraryLoader）と HGLOBAL/HMODULE
# （Win32_Foundation）はワークスペース既定で供給済。
windows = { workspace = true, features = [
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Globalization",
] }
windows-core = { workspace = true }

# host-32 先進坑 helper（i686 別ターゲットビルドの独立バイナリ・議題 3 確定）。
# サブフォルダの helper.rs は auto-discovery 対象外ゆえ明示宣言する。
# 親 x64 entry（examples/shiori-host-32/main.rs）は auto-discovery で example
# `shiori-host-32` として解決されるため宣言不要（非衝突）。
[[example]]
name = "shiori-host-32-helper"
path = "examples/shiori-host-32/helper.rs"
