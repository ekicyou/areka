[package]
name = "areka-user-data"
workspace = "../.."
description = "書ける根（利用者ごとの置き場）を使う形の判断・場所・記憶の置き場と、その手続きを areka と中継が共有する葉のクレート（spec: areka-P0-user-data-root）"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false # areka 本体と中継の部品・ほかでは意味を持たない
repository.workspace = true

[dependencies]
# 形・理由・写し・引き継ぎの記録（文は ASCII・中継が標準エラーへ出すため）。
tracing = { workspace = true }

[dev-dependencies]
# 写しと引き継ぎのテストの根をワークツリーの target\ の下に作る唯一の窓口。
temp-path-kit = { path = "../temp-path-kit" }
# ログ捕捉テストの唯一の定義元（テスト専用・[dependencies] へは置かない）。
log-capture-kit = { path = "../log-capture-kit" }
