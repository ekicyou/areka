[workspace]
members = [
    "crates/*",
]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2024"
authors = ["ekicyou <dot.station@gmail.com>"]
license = "MIT"
repository = "https://github.com/ekicyou/areka"

[workspace.dependencies]
encoding_rs = "0.8"
human-panic = "2.0.6"
rand = "0.10"
rectangle-pack = "=0.4.2"
windows-numerics = "0.3.1"
windows-core = "0.62.2"
ambassador = "0.5.0"
taffy = "0.13"
nonmax = "0.5.5"
bevy_tasks = "0.19"
bevy_utils = "0.19"
thiserror = "2"
tracing = "0.1"
toml = "1"
wintf-winmsg-executor = "=0.0.5"
event-listener = "5"
async-channel = "2"
bitflags = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dola = { version = "0.0.2", path = "crates/dola" }

[workspace.dependencies.bevy_app]
version = "0.19"
features = [
    "bevy_reflect",
    "std",
]

[workspace.dependencies.bevy_ecs]
version = "0.19"
features = [
    "async_executor",
    "backtrace",
    "bevy_reflect",
    "std",
    "multi_threaded",
    "serialize",
]

[workspace.dependencies.async-executor]
version = "1"
features = ["static"]

[workspace.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Graphics_DirectX",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging_D2D",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_UI_Animation",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
]

[patch.crates-io]
# 公開版 image-webp 0.2.0〜0.2.4 は透過のある動く WebP のコマに前のコマを残す。直し（#171・#178・#179）を
# 載せた枝 release-0.2.5 の先頭へ固定する（spec: areka-P0-animated-image-decode 要件 7.6）。
# 足した後は `cargo update -p image-webp` が要る（しないと [[patch.unused]] になり黙って公開版が使われる）。
# 外す条件: 0.2.5 以上が crates.io に出たら、この行と deny.toml の allow-git を外して公開版へ戻す。
image-webp = { git = "https://github.com/image-rs/image-webp", rev = "75f810915d02ae4ff55d3f825bf6a4b07efdf994" }

[profile.dev]
# デバッグ情報は行番号の表だけ（バックトレースのファイル名と行は残る・デバッガでローカル変数は見えない）。
# 静かな機械の実測（2026-10-07）で、冷えたビルド −22%・target の大きさ −45%・テストの実行時間は変わらず。
debug = "line-tables-only"

[profile.release]
# 最適化レベル。'z'はサイズを最優先で最適化します。
opt-level = 'z'
# リンク時最適化を有効にし、より積極的な最適化を行います。
lto = true
# コード生成ユニットを1にすることで、より多くの最適化が可能になりますが、コンパイル時間は長くなります。
codegen-units = 1
# パニック時にスタックを巻き戻し、バックトレースを可能にします。(変更)
panic = 'unwind'
# デバッグシンボルを実行ファイルに残し、詳細なバックトレースを可能にします。(変更)
strip = false

