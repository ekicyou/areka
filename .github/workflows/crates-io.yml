# 公開の段: その版の wintf・dola を、確かめてから crates.io へ出す（認証は Trusted Publishing だけ）。
# きっかけは 2 つだけ:
#   - タグ v{版} の push: 同じタグの release.yml の回が緑で終わるのを待ってから出す（release.yml はこの段を呼ばない）
#   - 手での起動（workflow_dispatch・入力 version）: やり直しの口。GitHub の Actions の画面の「Run workflow」から
# workflow_run は crates.io の Trusted Publishing が受け付けないので使わない。
# 同じ版で何度起動し直してもよい（既に出たクレートは飛ばす）。設定・やり直し・予備の手順は doc/crates-io-publish.md。
# 判定は tools/crates-io.ps1（タグのコミットの物）に集め、ここは順に呼ぶ・待つ・止める・鍵を受け取るだけ。
name: crates-io

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 出す版（v を付けない。例 0.0.2）
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read  # release.yml の回の様子を読む

concurrency:
  group: crates-io
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 版の形
        env:
          # タグ・入力はスクリプトの文に埋めず、環境変数で渡す
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if ($env:EVENT -ceq 'push') {
            if ($env:TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+\z') {
              Write-Host "::error::tag $($env:TAG | ConvertTo-Json) is not v followed by three numbers (e.g. v0.0.2); nothing published"
              exit 1
            }
            $version = $env:TAG.Substring(1)
          } else {
            if ($env:INPUT -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+\z') {
              Write-Host "::error::input version $($env:INPUT | ConvertTo-Json) is not three numbers (no v, e.g. 0.0.2); nothing published"
              exit 1
            }
            $version = $env:INPUT
          }
          # 形を確かめた値だけを後の段へ渡す
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "version: $version (trigger: $env:EVENT)"

      - name: release を待つ
        # タグの push のときだけ。手での起動は、次の「Release の確認」が同じことを確かめる
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 待つ長さ（変えるのはこの 2 行だけ）
          $LIMIT_MINUTES = 120
          $POLL_SECONDS = 30
          $tag = "v$env:VERSION"
          $until = [DateTime]::UtcNow.AddMinutes($LIMIT_MINUTES)
          while ($true) {
            # 同じコミット・同じタグの push で始まった release.yml の回（新しい順）
            # ブランチ名・状態・結論の 3 つの欄（どれも ASCII）だけに絞って読む。回の題やコミットの文は読まない
            # （端末の文字コードに依らず行が混ざらない）。結論が null のときは文字 null
            $out = @(gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=push&head_sha=$env:GITHUB_SHA" --jq '.workflow_runs[] | [.head_branch, .status, (.conclusion | tostring)] | @tsv' 2>&1)
            $code = $LASTEXITCODE
            $err = ($out | Where-Object { $_ -is [Management.Automation.ErrorRecord] }) -join ' '
            if ($code -and $err -match 'HTTP 404') {
              Write-Host "::error::release.yml (the workflow that creates the Release) is not in the repository; nothing published for $tag"
              exit 1
            }
            if ($code) {
              # 一時的な失敗は待つ側に数える。gh の文はそのまま出さない（状態の番号だけ）
              $state = "unreadable ($([regex]::Match($err, 'HTTP [0-9]+').Value))"
            } else {
              # 1 つ目の欄がタグと字のとおり同じ最初の行（新しい順なので最新の回）
              $run = $out | Where-Object { $_ -isnot [Management.Automation.ErrorRecord] } |
                ForEach-Object { , ([string]$_ -split "`t") } | Where-Object { $_[0] -ceq $tag } | Select-Object -First 1
              if (-not $run) { $state = 'not started yet' }
              elseif ($run[1] -cne 'completed') { $state = $run[1] }
              elseif ($run[2] -ceq 'success') {
                Write-Host "release finished green ($tag)"
                exit 0
              } else {
                $conclusion = $run[2]
                Write-Host "::error::release for $tag finished with $conclusion; nothing published. Make release green, then re-run this run"
                exit 1
              }
            }
            if ([DateTime]::UtcNow -ge $until) {
              Write-Host "::error::release for $tag is not green after $LIMIT_MINUTES minutes (last state: $state); nothing published"
              exit 1
            }
            Write-Host "waiting: release for $tag is $state"
            Start-Sleep -Seconds $POLL_SECONDS
          }

      - name: 取り出し
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ env.VERSION }}
          persist-credentials: false

      - name: Release の確認
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $draft = gh release view "v$env:VERSION" --json isDraft --jq .isDraft
          if ($LASTEXITCODE) {
            Write-Host "::error::GitHub Release v$env:VERSION not found (drafts are not readable with this permission, so a draft also stops here). Publish the Release, then start again. Nothing published"
            exit 1
          }
          if ($draft -ne 'false') {
            Write-Host "::error::GitHub Release v$env:VERSION is a draft. Publish the Release, then start again. Nothing published"
            exit 1
          }

      - name: 道具
        run: rustup update stable --no-self-update

      - name: 公開前の確認
        run: pwsh -NoProfile -File tools/crates-io.ps1 -Verify -Version $env:VERSION

      - name: 残りの判定
        id: pending
        run: |
          # 標準出力はまだ出ていないクレートの名前だけ（人が読む行は標準エラー）。混ぜない
          $names = @(pwsh -NoProfile -File tools/crates-io.ps1 -Pending -Version $env:VERSION)
          # 途中で落ちると名前が一部だけ出ていることがあるので、終了コードを先に見る
          if ($LASTEXITCODE) { exit 1 }
          Write-Host "pending: $(if ($names) { $names -join ' ' } else { 'none (all published)' })"
          "names=$($names -join ' ')" >> $env:GITHUB_OUTPUT

      - name: 鍵
        id: auth
        if: steps.pending.outputs.names != ''
        uses: rust-lang/crates-io-auth-action@v1

      - name: 公開
        if: steps.pending.outputs.names != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          NAMES: ${{ steps.pending.outputs.names }}
        run: |
          # 依存の順は cargo が決める。組み立ては公開前の確認で済んでいる
          $pArgs = @(-split $env:NAMES | ForEach-Object { '-p', $_ })
          cargo publish --locked --no-verify @pArgs

      - name: 記録
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
        run: |
          if ($env:CHECKOUT -ne 'success') {
            'stopped before checkout (version format, wait for release, checkout); nothing published' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          # 子の人が読む行（present・absent）は UTF-8 で標準エラーへ出る。名前（標準出力）と分けて受け取る
          $errFile = Join-Path $env:RUNNER_TEMP 'crates-io-pending.txt'
          $names = @(pwsh -NoProfile -File tools/crates-io.ps1 -Pending -Version $env:VERSION 2> $errFile)
          $code = $LASTEXITCODE
          $lines = @(Get-Content -LiteralPath $errFile -Encoding utf8 -ErrorAction Ignore)
          $summary = @("## crates.io v$env:VERSION", '') + @($lines | ForEach-Object { "- $_" }) + ''
          if ($code) { $summary += "pending check failed (exit code $code)" }
          elseif ($names) { $summary += "not yet published: $($names -join ' ')" }
          else { $summary += 'all published' }
          $summary >> $env:GITHUB_STEP_SUMMARY
          if ($code -or $names) { exit 1 }
