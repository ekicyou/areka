name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.99.0

jobs:
  release:
    runs-on: windows-2025-vs2026
    timeout-minutes: 150
    env:
      # 本番（Release を公開する）はタグの push のときだけ。それ以外は乾いた走り。
      PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 改行の設定
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $origin = git config --show-origin --get core.autocrlf
          if ($LASTEXITCODE -ne 0) { $origin = '(未設定)' }
          Write-Host "core.autocrlf の元の値と出どころ: $origin"
          git config --global core.autocrlf true

      - name: 取り出し
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust の固定
        timeout-minutes: 10
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default $env:RUST_TOOLCHAIN

      - name: 版の検査
        id: version
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          # 入力は環境変数だけ（GITHUB_REF_TYPE・GITHUB_REF_NAME）。手元でも差し替えて同じ本文を回せる
          # 版の読み方は tools/package.ps1 と同じ（areka パッケージの version）
          $out = @(cargo metadata --no-deps --locked --format-version 1 2>&1)
          $code = $LASTEXITCODE
          $err = @($out | Where-Object { $_ -is [Management.Automation.ErrorRecord] } | ForEach-Object { "$_" })
          if ($code) {
            Write-Host ("版を読めない（cargo metadata が終了コード {0}: {1}）" -f $code, ($err | Select-Object -Last 1))
            exit 1
          }
          try {
            $meta = ($out | Where-Object { $_ -isnot [Management.Automation.ErrorRecord] }) -join "`n" | ConvertFrom-Json
          } catch {
            Write-Host "版を読めない（cargo metadata の出力が JSON として読めない: $_）"
            exit 1
          }
          $pkg = @($meta.packages | Where-Object { $_.name -ceq 'areka' })
          if ($pkg.Count -ne 1) {
            Write-Host "版を読めない（cargo metadata に areka のパッケージが $($pkg.Count) 件）"
            exit 1
          }
          $version = "$($pkg[0].version)"
          if ($env:GITHUB_REF_TYPE -ceq 'tag') {
            $tagVersion = $env:GITHUB_REF_NAME
            if ($tagVersion.StartsWith('v', [StringComparison]::Ordinal)) { $tagVersion = $tagVersion.Substring(1) }
            if (-not ($tagVersion -ceq $version)) {
              Write-Host "タグの版と Cargo.toml の版が違う（タグの版 '$tagVersion'・Cargo.toml の版 '$version'）"
              exit 1
            }
            Write-Host "タグの版と Cargo.toml の版が一致（'$version'）"
          } else {
            Write-Host "タグが無いので比べを飛ばす（Cargo.toml の版 '$version'）"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 既存の Release の検査
        id: guard
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          # 入力は環境変数だけ（GITHUB_REF_TYPE・GITHUB_REF_NAME・GITHUB_REPOSITORY・PUBLISH・GH_TOKEN・VERSION）
          # 読むだけ。リポジトリにも Release にも書かない
          # 一つ前のタグを決める関数（API の呼び出しと分け、手元で並びを差し替えて回せるようにする）
          # 版は [semver] で読み比べる（[version] は付記つきを読めない）。読めないタグは黙って飛ばす
          function Get-PrevTag([string[]]$Names, [string]$Version) {
            $current = [System.Management.Automation.SemanticVersion]::Parse($Version)
            $best = $null
            $bestName = ''
            foreach ($name in $Names) {
              if (-not $name.StartsWith('v', [StringComparison]::Ordinal)) { continue }
              $v = $null
              if (-not [System.Management.Automation.SemanticVersion]::TryParse($name.Substring(1), [ref]$v)) { continue }
              if ($v -lt $current -and ($null -eq $best -or $v -gt $best)) {
                $best = $v
                $bestName = $name
              }
            }
            return $bestName
          }
          $tag = if ($env:GITHUB_REF_TYPE -ceq 'tag') { $env:GITHUB_REF_NAME } else { "v$env:VERSION" }
          # タグの名前で Release を探す行（後始末の段と 1 字違わず同じ）。下書きを含む一覧を全部取る
          $found = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | [.tag_name, .id, .html_url, .draft] | @tsv' | Where-Object { $_.Split("`t")[0] -ceq $tag })
          if ($LASTEXITCODE) {
            Write-Host "Release の一覧を取れない（gh api が終了コード $LASTEXITCODE）"
            exit 1
          }
          if ($found.Count) {
            foreach ($row in $found) {
              $f = $row.Split("`t")
              Write-Host "タグ '$tag' の Release が既に在る（URL $($f[2])・下書き $($f[3])）"
            }
            if ($env:PUBLISH -ceq 'true') { exit 1 }
            Write-Host '乾いた走りなので止めずに続ける'
          } else {
            Write-Host "タグ '$tag' の Release は無い（下書きを含めて 0 件）"
            'absent=true' >> $env:GITHUB_OUTPUT
          }
          $names = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name')
          if ($LASTEXITCODE) {
            Write-Host "タグの一覧を取れない（gh api が終了コード $LASTEXITCODE）"
            exit 1
          }
          $prevTag = Get-PrevTag $names $env:VERSION
          Write-Host "一つ前のタグ: '$prevTag'"
          "prev_tag=$prevTag" >> $env:GITHUB_OUTPUT
